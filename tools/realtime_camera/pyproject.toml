[project]
name = "nono-realtime-camera"
version = "0.1.0"
description = "Low-latency one-second camera understanding prototype"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mediapipe==0.10.31",
  "numpy==2.2.6",
  "opencv-python==4.12.0.88",
  "psutil==7.0.0",
]

[project.scripts]
nono-camera = "nono_realtime_camera.cli:main"

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nono_realtime_camera"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
