      function dispatchAction(action, target) {
        const routes = {
          'nav-home': 'home',
          'nav-capabilities': 'capabilities',
          'nav-activity': 'activity',
          'nav-settings': 'settings',
        };
        if (routes[action]) navigate(routes[action]);
        else if (action === 'go-back') goBack();
        else if (action === 'open-companion-config') {
          openSettingsPage('companion-config');
        } else if (action === 'open-avatar-looks') {
          openSettingsPage('avatar-looks');
        } else if (action === 'select-look') {
          const item = appState.looks.items.find(
            look => look.id === target.dataset.id,
          );
          if (!item?.installed) {
            showToast('请先下载这个角色', 'warning');
            return;
          }
          appState.looks.activeId = item.id;
          showToast(`已换成「${item.title}」`, 'success');
          renderApp();
        } else if (action === 'request-look-download') {
          const item = appState.looks.items.find(
            look => look.id === target.dataset.id,
          );
          if (!item || item.installed || appState.looks.downloadingId) return;
          appState.modal = {
            type: 'download-look',
            id: item.id,
            title: `下载「${item.title}」？`,
            message: `约 ${item.sizeLabel}，当前按 Wi-Fi 演示。确认后只走页面进度，不会访问真实网络。失败仍用默认角色。`,
          };
          renderModal();
        } else if (action === 'confirm-look-download') {
          const id = appState.modal?.id;
          appState.modal = null;
          modalReturnFocus = null;
          startLookDownload(id);
        } else if (action === 'open-capability') {
          const dest = {
            phone: 'models',
            errands: 'errands',
            openclaw: 'openclaw',
            privacy: 'privacy',
          }[target.dataset.id];
          if (dest) openCapabilityPage(dest);
        } else if (action === 'toggle-capability') {
          const key = target.dataset.key;
          appState.capabilities[key] = !appState.capabilities[key];
          if (key === 'openclaw' && appState.capabilities.openclaw) {
            showToast('远程开启：操作走网关。首页说话仍用陪伴模型', 'info');
          } else if (
            key === 'openclaw' &&
            !appState.capabilities.openclaw &&
            appState.privacy.memoryLocation === 'openclaw'
          ) {
            appState.privacy.memoryLocation = 'device';
            showToast('OpenClaw 已关，记忆改回仅这台手机', 'warning');
          } else {
            showToast(
              appState.capabilities[key] ? '能力已打开' : '能力已关闭',
              appState.capabilities[key] ? 'success' : 'warning',
            );
          }
          renderApp();
        } else if (action === 'toggle-memory') {
          appState.privacy.memoryEnabled = !appState.privacy.memoryEnabled;
          showToast(
            appState.privacy.memoryEnabled
              ? '记忆已打开，称呼和偏好在活动页'
              : '记忆已关闭。交代的事不受影响',
            appState.privacy.memoryEnabled ? 'success' : 'warning',
          );
          renderApp();
        } else if (action === 'select-memory-location') {
          if (
            target.dataset.location === 'openclaw' &&
            !appState.capabilities.openclaw
          ) {
            showToast('先打开 OpenClaw，才能把记忆放在网关', 'warning');
            return;
          }
          appState.privacy.memoryLocation = target.dataset.location;
          showToast(`记忆${memoryLocationLabel()}`, 'success');
          renderApp();
        } else if (action === 'select-activity-tab') {
          appState.activityTab = target.dataset.tab;
          renderApp();
        } else if (action === 'open-errand') {
          openSecondary('errand-detail', {id: target.dataset.id});
        } else if (action === 'select-errand-type') {
          const form = document.getElementById('errand-form');
          const values = form
            ? Object.fromEntries(new FormData(form).entries())
            : {};
          const item = appState.memories.find(
            mem => mem.id === appState.viewData.id,
          );
          appState.viewData = {
            ...appState.viewData,
            draft: {
              ...item,
              ...(appState.viewData.draft || {}),
              ...values,
              when: values.when || appState.viewData.draft?.when || item?.when || '',
              errandType: target.dataset.type,
            },
            errors: {},
          };
          renderApp();
        } else if (action === 'save-errand') {
          saveErrand(document.getElementById('errand-form'));
        } else if (action === 'forget-memory') {
          const item = appState.memories.find(mem => mem.id === target.dataset.id);
          appState.modal = {
            type: 'forget-memory',
            id: target.dataset.id,
            title: '忘掉这一条？',
            message: `${item?.title || '这条记忆'} 会从这次演示里清除，任务记录仍保留。`,
          };
          renderModal();
        } else if (action === 'confirm-forget-memory') {
          const id = appState.modal?.id;
          appState.memories = appState.memories.filter(item => item.id !== id);
          appState.modal = null;
          modalReturnFocus = null;
          showToast('已忘掉这一条', 'warning');
          renderApp();
        } else if (action === 'forget-all-memory') {
          appState.modal = {
            type: 'forget-all-memory',
            title: '忘掉全部称呼和偏好？',
            message: '交代的事不会取消。任务活动仍保留。',
          };

        } else if (action === 'confirm-forget-all-memory') {
          appState.memories = appState.memories.filter(
            item => item.kind === 'errand',
          );
          appState.modal = null;
          modalReturnFocus = null;
          showToast('已忘掉称呼和偏好', 'warning');
          renderApp();
        } else if (action === 'cancel-errand') {
          const item = appState.memories.find(mem => mem.id === target.dataset.id);
          appState.modal = {
            type: 'cancel-errand',
            id: target.dataset.id,
            title: '取消这件交代？',
            message: `${item?.title || '这件事'} 不会再办。已经做过的记录仍留在「做过的事」。`,
          };
          renderModal();
        } else if (action === 'confirm-cancel-errand') {
          const id = appState.modal?.id;
          appState.memories = appState.memories.filter(item => item.id !== id);
          appState.modal = null;
          modalReturnFocus = null;
          showToast('已取消这件交代', 'warning');
          if (appState.route === 'errand-detail') goBack();
          else renderApp();
        } else if (action === 'activate-avatar') {
          startVoiceListen();
        } else if (action === 'confirm-heard') {
          if (!isOperateReady()) {
            redirectForOperateSetup();
            return;
          }
          createDemoTask(appState.heardText);
        } else if (action === 'dismiss-heard') {
          clearHeard();
          renderApp();
        } else if (action === 'accept-heard-memory') {
          acceptHeardMemory();
        } else if (action === 'save-heard-errand') {
          saveHeardAsErrand();
        } else if (action === 'select-agent-mode') {
          appState.agent.draftMode = target.dataset.mode;
          ensureModeModelsSelected(appState.agent.draftMode);
          renderApp();
        } else if (action === 'save-agent-mode') {
          if (isTaskBusy()) {
            showToast('任务进行中不能切换运行模式', 'warning');
            return;
          }
          const mode = appState.agent.draftMode;
          if (mode === 'cloud_direct' && !appState.agent.lists.unified.activeId) {
            showToast('请先选择一体化模型', 'warning');
            return;
          }
          if (
            mode === 'cloud_split' &&
            !(
              appState.agent.lists.splitVision.activeId &&
              appState.agent.lists.splitPlanner.activeId
            )
          ) {
            showToast('请先为视觉和编排各选一个模型', 'warning');
            return;
          }
          if (
            mode === 'local_vision_cloud_planner' &&
            !appState.agent.lists.localPlanner.activeId
          ) {
            showToast('请先选择编排模型', 'warning');
            return;
          }
          if (
            mode === 'local_vision_cloud_planner' &&
            appState.agent.eligibility !== 'ready'
          ) {
            showToast('本地视觉尚未就绪，不能启用这个模式', 'warning');
            return;
          }
          appState.agent.activeMode = mode;
          showToast('已启用新的运行模式', 'success');
          renderApp();
        } else if (action === 'request-local-download') {
          if (isTaskBusy()) return;
          appState.modal = {
            type: 'download-local-model',
            title: '通过 Wi-Fi 下载本地视觉模型？',
            message:
              '演示包约 1.64 GB。确认后只走页面内进度，不会访问真实网络或写入设备存储。',
          };
          renderModal();
        } else if (action === 'confirm-local-download') {
          appState.modal = null;
          modalReturnFocus = null;
          startLocalVisionDownload();
        } else if (action === 'run-local-test') {
          if (isTaskBusy()) return;
          runLocalVisionTest();
        } else if (action === 'toggle-overlay') {
          if (performance.now() < (appState.overlay.ignoreClickUntil || 0)) {
            return;
          }
          appState.overlay.peek = false;
          appState.overlay.expanded = !appState.overlay.expanded;
          renderOverlay();
        } else if (action === 'surface-open-task') {
          openTaskFromSurface(target.dataset.source);
        } else if (action === 'surface-request-stop') {
          appState.notificationTrayOpen = false;
          requestTaskStop(target.dataset.source);
          renderNotification();
        } else if (action === 'toggle-notification-tray') {
          appState.notificationTrayOpen = !appState.notificationTrayOpen;
          renderNotification();
        } else if (action === 'add-model') {
          openSecondary('model-form', {
            mode: 'add',
            list: target.dataset.list || 'unified',
          });
        } else if (action === 'edit-model') {
          openSecondary('model-form', {
            mode: 'edit',
            list: target.dataset.list || 'unified',
            id: target.dataset.id,
          });
        } else if (action === 'select-model') {
          const store = getModelList(target.dataset.list || 'unified');
          store.activeId = target.dataset.id;
          showToast('已切换到这条配置', 'success');
          renderApp();
        } else if (action === 'delete-model') {
          const store = getModelList(target.dataset.list || 'unified');
          const model = store.items.find(item => item.id === target.dataset.id);
          appState.modal = {
            type: 'delete-model',
            id: target.dataset.id,
            list: target.dataset.list || 'unified',
            title: '删除这个模型配置？',
            message: `${
              model?.name || '该模型'
            } 将从本次演示中移除。此操作不会影响任何真实服务。`,
          };
          renderModal();
        } else if (action === 'confirm-delete-model') {
          const id = appState.modal?.id;
          const store = getModelList(appState.modal?.list || 'unified');
          store.items = store.items.filter(model => model.id !== id);
          if (store.activeId === id) {
            store.activeId = store.items[0]?.id || null;
          }
          appState.modal = null;
          modalReturnFocus = null;
          showToast('模型配置已删除', 'warning');
          renderApp();
        } else if (action === 'save-model') {
          saveModel(document.getElementById('model-form'));
        } else if (action === 'open-api-guide') {
          openSecondary('api-guide');
        } else if (action === 'filter-activity') {
          appState.activityFilter = target.dataset.filter;
          renderApp();
        } else if (action === 'open-task-detail') {
          openSecondary('task-detail', {id: target.dataset.id});
        } else if (action === 'rerun-task') {
          const activity = appState.activities.find(
            item => item.id === target.dataset.id,
          );
          appState.route = 'home';
          appState.stack = [];
          createDemoTask(activity?.instruction);
        } else if (action === 'toggle-setting') {
          const key = target.dataset.key;
          appState.settings[key] = !appState.settings[key];
          showToast('设置已更新', 'success');
          renderApp();
        } else if (action === 'toggle-permission') {
          const key = target.dataset.key;
          appState.permissions[key] = !appState.permissions[key];
          showToast(
            appState.permissions[key]
              ? '演示权限已开启'
              : '演示权限已关闭，相关界面已降级',
            appState.permissions[key] ? 'success' : 'warning',
          );
          renderApp();
        } else if (action === 'open-debug-logs') {
          openSecondary('debug-logs');
        } else if (action === 'open-about') {
          openSecondary('about');
        } else if (action === 'choose-suggestion') {
          appState.taskInput = target.dataset.value || '';
          renderApp();
          document.getElementById('task-input')?.focus();
        } else if (action === 'clear-task-input') {
          appState.taskInput = '';
          renderApp();
        } else if (action === 'start-task') {
          createDemoTask(document.getElementById('task-input')?.value);
        } else if (action === 'advance-task') advanceTask();
        else if (action === 'confirm-task') resolveConfirmation(true);
        else if (action === 'reject-task') resolveConfirmation(false);
        else if (action === 'simulate-takeover' && appState.task) {
          appState.task.status = 'manual_takeover';
          renderApp();
        } else if (action === 'complete-takeover' && appState.task) {
          appState.task.status = 'running';
          appState.task.stepIndex = Math.min(
            appState.task.stepIndex + 1,
            appState.task.steps.length - 1,
          );
          showToast('已接回任务，NoNo 继续执行', 'success');
          renderApp();
        } else if (action === 'simulate-error') finishTask('failed');
        else if (action === 'request-stop-task') requestTaskStop('app');
        else if (action === 'cancel-modal') {
          closeModal();
        } else if (action === 'confirm-stop-task') {
          appState.modal = null;
          modalReturnFocus = null;
          finishTask('cancelled');
        } else if (action === 'new-task') {
          appState.task = null;
          appState.taskInput = '';
          clearHeard();
          renderApp();
        } else if (action === 'rerun-current' && appState.task) {
          createDemoTask(appState.task.instruction);
        } else if (action === 'reset-demo') location.reload();
      }

      document.addEventListener('click', event => {
        const target = event.target.closest('[data-action]');
        if (target) dispatchAction(target.dataset.action, target);
        if (!event.target.closest('[data-overlay-widget]')) collapseOverlay();
      });

      document.addEventListener('pointermove', event => {
        const shell = document.getElementById('phone-shell');
        if (!shell.contains(event.target)) return;
        const rect = shell.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        const y = ((event.clientY - rect.top) / rect.height) * 2 - 1;
        window.NonoAvatar?.setLook(x, y);
      });
      document.addEventListener('pointerdown', beginOverlayDrag);
      document.addEventListener('pointermove', moveOverlay);
      document.addEventListener('pointerup', endOverlayDrag);
      document.addEventListener('pointercancel', endOverlayDrag);

      document.addEventListener('input', event => {
        if (event.target.id !== 'task-input') return;
        appState.taskInput = event.target.value;
        const button = document.querySelector('[data-action="start-task"]');
        if (button) button.disabled = !appState.taskInput.trim();
      });

      document.addEventListener('keydown', event => {
        if (!appState.modal) return;
        if (event.key === 'Escape') {
          event.preventDefault();
          closeModal();
          return;
        }
        if (event.key !== 'Tab') return;
        const dialog = document.querySelector('[role="dialog"]');
        const controls = [...dialog.querySelectorAll('button')].filter(
          element => !element.disabled,
        );
        if (!controls.length) return;
        const first = controls[0];
        const last = controls[controls.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });

      document.addEventListener('avatar-ready', () => syncAvatar());
      renderApp();
    </script>
    <script src="./vendor/three.min.js"></script>
    <script>
      const THREE = window.THREE;
      const host = document.getElementById('avatar-host');
      const canvas = document.getElementById('avatar-canvas');
      if (!THREE) {
        console.warn('NoNo avatar missing local three.min.js');
      } else if (!host || !canvas) {
        console.warn('NoNo avatar host missing');
      } else try {

      const reducedMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)',
      ).matches;
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 20);
      camera.position.set(0, 0.12, 4.2);

      scene.add(new THREE.HemisphereLight(0xf3f0ff, 0x8b82d4, 1.15));
      const key = new THREE.DirectionalLight(0xffffff, 1.35);
      key.position.set(2.2, 3.2, 4);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x8df4e2, 0.55);
      rim.position.set(-3, 1.2, -2);
      scene.add(rim);

      const root = new THREE.Group();
      root.scale.setScalar(0.52);
      scene.add(root);

      const bodyMat = new THREE.MeshPhysicalMaterial({
        color: 0x8a80ed,
        roughness: 0.28,
        metalness: 0.18,
        clearcoat: 0.72,
        clearcoatRoughness: 0.22,
        sheen: 0.45,
        sheenColor: new THREE.Color(0xffffff),
      });
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.78, 48, 36), bodyMat);
      body.scale.set(1, 0.92, 0.86);
      root.add(body);
      const shadow = new THREE.Mesh(
        new THREE.CircleGeometry(0.72, 32),
        new THREE.MeshBasicMaterial({
          color: 0x2c2a4c,
          transparent: true,
          opacity: 0.2,
        }),
      );
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = -0.9;
      root.add(shadow);

      const earGeo = new THREE.CapsuleGeometry(0.09, 0.28, 6, 12);
      const leftEar = new THREE.Mesh(earGeo, bodyMat);
      leftEar.position.set(-0.72, 0.08, 0);
      leftEar.rotation.z = 0.35;
      const rightEar = leftEar.clone();
      rightEar.position.x = 0.72;
      rightEar.rotation.z = -0.35;
      root.add(leftEar, rightEar);

      const visor = new THREE.Mesh(
        new THREE.BoxGeometry(0.92, 0.38, 0.18),
        new THREE.MeshPhysicalMaterial({
          color: 0x1b1d30,
          roughness: 0.18,
          metalness: 0.35,
          clearcoat: 0.8,
        }),
      );
      visor.position.set(0, 0.06, 0.62);
      visor.scale.set(1, 1, 0.7);
      root.add(visor);

      const eyeMat = new THREE.MeshStandardMaterial({
        color: 0x8df4e2,
        emissive: 0x8df4e2,
        emissiveIntensity: 1.4,
      });
      const eyes = new THREE.Group();
      const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12), eyeMat);
      leftEye.position.set(-0.16, 0.08, 0.08);
      const rightEye = leftEye.clone();
      rightEye.position.x = 0.16;
      eyes.position.set(0, 0.06, 0.72);
      eyes.add(leftEye, rightEye);
      root.add(eyes);

      const light = new THREE.Mesh(
        new THREE.SphereGeometry(0.055, 12, 10),
        new THREE.MeshStandardMaterial({
          color: 0x8df4e2,
          emissive: 0x8df4e2,
          emissiveIntensity: 1.6,
        }),
      );
      light.position.set(0.34, 0.18, 0.7);
      root.add(light);

      let layout = 'hidden';
      let mood = 'idle';
      let look = {x: 0, y: 0};
      let targetLook = {x: 0, y: 0};

      function resize() {
        const width = Math.max(1, host.clientWidth);
        const height = Math.max(1, host.clientHeight);
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.position.z = layout === 'stage' ? 3.9 : 4.15;
        camera.updateProjectionMatrix();
      }

      new ResizeObserver(resize).observe(host);

      const moodColors = {
        idle: 0x8df4e2,
        listen: 0xb7fff4,
        thinking: 0x9aa6ff,
        confirm: 0xff9b79,
        success: 0x8df4e2,
        error: 0xff9b79,
      };

      function applyMood(next) {
        mood = next;
        const color = moodColors[next] || moodColors.idle;
        eyeMat.color.setHex(color);
        eyeMat.emissive.setHex(color);
        light.material.color.setHex(color);
        light.material.emissive.setHex(color);
        eyeMat.emissiveIntensity = next === 'listen' ? 2.1 : 1.4;
      }

      function tick(now) {
        const t = now * 0.001;
        look.x += (targetLook.x - look.x) * 0.08;
        look.y += (targetLook.y - look.y) * 0.08;
        const breathe = reducedMotion ? 0 : Math.sin(t * 2.1) * 0.028;
        const think = mood === 'thinking' && !reducedMotion ? Math.sin(t * 8) * 0.03 : 0;
        root.position.y = breathe;
        root.rotation.y = look.x * 0.28 + (reducedMotion ? 0 : Math.sin(t * 0.7) * 0.06);
        root.rotation.x = -look.y * 0.16 + think;
        eyes.rotation.y = look.x * 0.18;
        eyes.rotation.x = -look.y * 0.12;
        visor.scale.y = mood === 'thinking' ? 0.82 : 1;
        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }

      window.NonoAvatar = {
        setLayout(next) {
          layout = next;
          resize();
        },
        setMood: applyMood,
        setLook(x, y) {
          targetLook.x = Math.max(-1, Math.min(1, x));
          targetLook.y = Math.max(-1, Math.min(1, y));
        },
      };

      host.classList.add('is-ready');
      resize();
      requestAnimationFrame(tick);
      document.dispatchEvent(new Event('avatar-ready'));
      } catch (error) {
        console.warn('NoNo 3D avatar using CSS fallback', error);
      }
    </script>
  </body>
