<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <style>
      html,
      body,
      #host,
      canvas {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #f8f7f3;
        overflow: hidden;
      }
      canvas {
        touch-action: none;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      canvas:focus-visible {
        outline: 2px solid #369c9c;
        outline-offset: -3px;
      }
      body {
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="host" data-layout="stage">
      <canvas
        id="avatar-canvas"
        tabindex="0"
        aria-label="NoNo，拖动或使用方向键旋转，按 Home 回到正面"></canvas>
    </div>
    <script type="module" src="scene.js"></script>
  </body>
</html>
