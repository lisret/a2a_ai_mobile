<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script src="OrbitControls.js"></script>
<script src="three-vrm.min.js"></script>
<script>
(function () {
  function post(payload) {
    try {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(payload));
      }
    } catch (err) {}
  }

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setClearColor(0x000000, 0);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (THREE.sRGBEncoding) {
    renderer.outputEncoding = THREE.sRGBEncoding;
  }
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.05, 30);
  camera.position.set(0, 0.92, 1.55);

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  var key = new THREE.DirectionalLight(0xfff4e8, 0.85);
  key.position.set(0.5, 1.6, 1.1);
  scene.add(key);
  var fill = new THREE.DirectionalLight(0xc5d4ff, 0.35);
  fill.position.set(-0.8, 0.6, 0.4);
  scene.add(fill);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enablePan = false;
  controls.enableZoom = false;
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(0, 0.78, 0);
  controls.minPolarAngle = Math.PI * 0.44;
  controls.maxPolarAngle = Math.PI * 0.56;
  controls.minAzimuthAngle = -0.75;
  controls.maxAzimuthAngle = 0.75;
  controls.update();

  var clock = new THREE.Clock();
  var currentVrm = null;
  var mood = 'idle';

  function setBlend(name, value) {
    if (!currentVrm || !currentVrm.blendShapeProxy) {
      return;
    }
    try {
      currentVrm.blendShapeProxy.setValue(name, value);
    } catch (err) {}
  }

  window.__setMood = function (next) {
    mood = next || 'idle';
    ['fun', 'joy', 'angry', 'sorrow', 'a', 'i', 'u', 'e', 'o'].forEach(function (name) {
      setBlend(name, 0);
    });
    if (mood === 'done') {
      setBlend('fun', 0.55);
      setBlend('joy', 0.4);
    } else if (mood === 'error') {
      setBlend('sorrow', 0.75);
    } else if (mood === 'work') {
      setBlend('a', 0.2);
    }
  };

  var loader = new THREE.GLTFLoader();
  loader.crossOrigin = 'anonymous';
  loader.load(
    'elel.vrm',
    function (gltf) {
      if (!window.THREE_VRM || !THREE_VRM.VRM || !THREE_VRM.VRM.from) {
        post({ type: 'error', message: 'THREE_VRM.VRM.from missing' });
        return;
      }
      THREE_VRM.VRM.from(gltf)
        .then(function (vrm) {
          currentVrm = vrm;
          if (THREE_VRM.VRMUtils && typeof THREE_VRM.VRMUtils.rotateVRM0 === 'function') {
            THREE_VRM.VRMUtils.rotateVRM0(vrm);
          }
          scene.add(vrm.scene);
          if (vrm.lookAt) {
            vrm.lookAt.target = camera;
          }
          window.__setMood(mood);
          post({ type: 'ready' });
        })
        .catch(function (err) {
          post({ type: 'error', message: String(err && err.message ? err.message : err) });
        });
    },
    undefined,
    function (err) {
      post({ type: 'error', message: String(err && err.message ? err.message : err) });
    }
  );

  var pressTimer = 0;
  var moved = false;
  renderer.domElement.addEventListener('pointerdown', function () {
    moved = false;
    pressTimer = setTimeout(function () {
      pressTimer = 0;
      post({ type: 'longpress' });
    }, 500);
  });
  renderer.domElement.addEventListener('pointermove', function () {
    moved = true;
  });
  renderer.domElement.addEventListener('pointerup', function () {
    if (pressTimer) {
      clearTimeout(pressTimer);
      pressTimer = 0;
      if (!moved) {
        post({ type: 'press' });
      }
    }
  });
  renderer.domElement.addEventListener('pointercancel', function () {
    if (pressTimer) {
      clearTimeout(pressTimer);
      pressTimer = 0;
    }
  });

  function animate() {
    requestAnimationFrame(animate);
    var dt = clock.getDelta();
    var t = clock.elapsedTime;
    if (currentVrm) {
      var cycle = t % 4.4;
      setBlend('blink', cycle > 4.15 && cycle < 4.28 ? 1 : 0);
      currentVrm.scene.position.y = Math.sin(t * 1.35) * 0.012;
      if (typeof currentVrm.update === 'function') {
        currentVrm.update(dt);
      }
    }
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  window.addEventListener('error', function (event) {
    post({ type: 'error', message: event.message || 'js error' });
  });
})();
</script>
</body>
</html>
