<!DOCTYPE html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width, initial-scale=1" /><title>
    NoNo · 动作预览
  </title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f8f7f3;
      color: #34332e;
      font: 15px system-ui;
      display: grid;
      place-content: center;
      min-height: 100vh;
    }
    main {
      width: min(94vw, 740px);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 21px;
      font-weight: 550;
    }
    small {
      color: #77766c;
    }
    iframe {
      width: 100%;
      height: min(64vh, 560px);
      border: 0;
    }
    nav {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      font: inherit;
      background: transparent;
      border: 1px solid #dad8ce;
      padding: 10px 17px;
      border-radius: 24px;
      cursor: pointer;
    }
    button[aria-pressed='true'] {
      background: #39392f;
      color: #fff;
      border-color: #39392f;
    }
    footer {
      margin: 24px 0;
      text-align: center;
      color: #77766c;
      font-size: 13px;
    }
    label {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin: 22px;
    }
    a {
      color: inherit;
    }
  </style>
  <main>
    <header>
      <h1>NoNo <small>动作预览</small></h1>
      <a href="/?platform=android&page=Home">回到 App 预览</a>
    </header>
    <iframe
      id="avatar"
      src="/nono-avatar/avatar.html"
      title="NoNo动作预览"></iframe>
    <nav aria-label="动作">
      <button data-mood="spin" aria-pressed="false">转一圈</button>
      <button data-mood="dance" aria-pressed="false">开心舞</button>
      <button data-mood="idle" aria-pressed="true">待机</button
      ><button data-mood="listen" aria-pressed="false">倾听</button
      ><button data-mood="thinking" aria-pressed="false">思考</button
      ><button data-mood="confirm" aria-pressed="false">点头</button
      ><button data-mood="success" aria-pressed="false">完成</button
      ><button data-mood="error" aria-pressed="false">疑惑</button>
      <button data-mood="wave" aria-pressed="false">招手</button>
      <button data-mood="happy" aria-pressed="false">开心</button>
      <button data-mood="sleepy" aria-pressed="false">困倦</button>
      <button data-mood="curious" aria-pressed="false">好奇</button>
      <button data-mood="wink" aria-pressed="false">眨单眼</button>
      <button data-mood="surprised" aria-pressed="false">惊讶</button>
      <button data-mood="shy" aria-pressed="false">害羞</button>
      <button data-mood="laugh" aria-pressed="false">大笑</button>
      <button data-mood="stretch" aria-pressed="false">伸懒腰</button>
      <button data-mood="peek" aria-pressed="false">探头</button>
      <button data-mood="unfold" aria-pressed="false">展开 95° / 80°</button>
      <button data-mood="fold" aria-pressed="false">收拢</button>
    </nav>
    <label
      >旋转角度
      <input
        id="rotation"
        aria-label="旋转角度"
        type="range"
        min="0"
        max="360"
        step="1"
        value="0" />
      <output id="angle">0°</output>
    </label>
    <nav aria-label="视角">
      <button id="auto" aria-pressed="false">自动旋转</button>
      <button id="reset">回到正面</button>
    </nav>
    <footer>
      拖动模型可 360°
      旋转，上下拖动调整视角；双击回正。转身与表情、折翼一起联动，结束后回到原观看方向和呼吸待机；默认上翼
      95°、下翼 80°，表情和动作结束后恢复默认展开。
    </footer>
  </main>
  <script>
    const frame = document.getElementById('avatar');
    document.querySelectorAll('[data-mood]').forEach(
      button =>
        (button.onclick = () => {
          const api = frame.contentWindow.NonoAvatar;
          if (!api) return;
          api.playMood(button.dataset.mood);
          document
            .querySelectorAll('[data-mood]')
            .forEach(b => b.setAttribute('aria-pressed', String(b === button)));
        }),
    );
    const rotation = document.getElementById('rotation');
    const auto = document.getElementById('auto');
    rotation.oninput = e =>
      frame.contentWindow.NonoAvatar?.setRotation(
        (Number(e.target.value) * Math.PI) / 180,
      );
    auto.onclick = () => {
      const api = frame.contentWindow.NonoAvatar;
      if (api) api.setAutoRotate(!api.getView().automatic);
    };
    document.getElementById('reset').onclick = () =>
      frame.contentWindow.NonoAvatar?.resetRotation();
    // Reflect actual animation/drag state so controls never show a finished action.
    setInterval(() => {
      const api = frame.contentWindow.NonoAvatar;
      if (!api || document.hidden) return;
      const view = api.getView();
      const degrees = Math.round(
        ((((view.yaw * 180) / Math.PI) % 360) + 360) % 360,
      );
      if (document.activeElement !== rotation) rotation.value = degrees;
      document.getElementById('angle').textContent = degrees + '°';
      auto.setAttribute('aria-pressed', String(view.automatic));
      document
        .querySelectorAll('[data-mood]')
        .forEach(button =>
          button.setAttribute(
            'aria-pressed',
            String(button.dataset.mood === api.getMood()),
          ),
        );
    }, 150);
  </script>
</html>
