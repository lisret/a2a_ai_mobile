<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NoNo 全应用交互原型</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1b1d30;
        --pearl: #f8f7f3;
        --cloud: #f1effa;
        --violet: #756bf0;
        --mint: #8df4e2;
        --coral: #ff9b79;
        --text: #202231;
        --muted: #777a88;
        --line: #e8e7ed;
        --white: #ffffff;
        --danger: #a94e40;
        --success: #267568;
        --shadow-sm: 0 10px 28px rgba(30, 31, 54, 0.08);
        --shadow-lg: 0 28px 80px rgba(31, 29, 65, 0.18);
        --radius-card: 24px;
        --radius-control: 16px;
        --motion-tab: 280ms;
        --motion-stack: 320ms;
        --motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: #dfdcf5;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        background: radial-gradient(
            circle at 18% 20%,
            #ffffff 0 5%,
            transparent 28%
          ),
          radial-gradient(circle at 83% 78%, #bdb7ff 0 2%, transparent 31%),
          linear-gradient(145deg, #e8e5ff 0%, #d8d5f6 48%, #cbc7f0 100%);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
          'PingFang SC', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
      }

      button,
      [role='button'] {
        -webkit-tap-highlight-color: transparent;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      [tabindex]:focus-visible {
        outline: 3px solid rgba(117, 107, 240, 0.44);
        outline-offset: 3px;
      }

      #app {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        position: relative;
      }

      #app::before,
      #app::after {
        content: '';
        position: fixed;
        pointer-events: none;
        border-radius: 42% 58% 52% 48%;
        filter: blur(2px);
        opacity: 0.5;
      }

      #app::before {
        width: 260px;
        height: 260px;
        left: -90px;
        top: 9vh;
        background: linear-gradient(145deg, #938aff, #7167d9);
        transform: rotate(24deg);
      }

      #app::after {
        width: 190px;
        height: 190px;
        right: -55px;
        bottom: 7vh;
        background: linear-gradient(145deg, #ffb39d, #ff8f72);
        transform: rotate(-21deg);
      }

      #phone-shell {
        width: min(390px, calc(100vw - 32px));
        height: min(844px, calc(100vh - 48px));
        min-height: 620px;
        position: relative;
        overflow: hidden;
        isolation: isolate;
        border-radius: 44px;
        background: var(--pearl);
        border: 7px solid rgba(255, 255, 255, 0.88);
        box-shadow: var(--shadow-lg), inset 0 0 0 1px rgba(31, 32, 49, 0.06);
      }

      #screen-root {
        height: 100%;
        position: relative;
        overflow: hidden;
        isolation: isolate;
        contain: paint;
        background: radial-gradient(
            circle at 92% 2%,
            #e5e1ff 0,
            transparent 30%
          ),
          linear-gradient(165deg, #fbfaf7 0%, var(--pearl) 54%, #f2effb 100%);
      }

      .screen-layer {
        position: absolute;
        inset: 0;
        height: 100%;
        overflow: hidden;
        background: inherit;
        transform: translate3d(0, 0, 0);
        backface-visibility: hidden;
        will-change: transform, opacity;
      }

      .screen-layer.is-current {
        z-index: 1;
      }

      #screen-root.is-layer-transitioning .screen-layer {
        pointer-events: none;
      }

      .screen-layer.is-incoming,
      .screen-layer.is-outgoing {
        animation-timing-function: var(--motion-ease);
        animation-fill-mode: both;
      }

      #screen-root.motion-tab-forward .screen-layer.is-incoming {
        z-index: 2;
        animation-name: layer-tab-in-forward;
        animation-duration: var(--motion-tab);
      }

      #screen-root.motion-tab-forward .screen-layer.is-outgoing {
        z-index: 1;
        animation-name: layer-tab-out-forward;
        animation-duration: var(--motion-tab);
      }

      #screen-root.motion-tab-back .screen-layer.is-incoming {
        z-index: 2;
        animation-name: layer-tab-in-back;
        animation-duration: var(--motion-tab);
      }

      #screen-root.motion-tab-back .screen-layer.is-outgoing {
        z-index: 1;
        animation-name: layer-tab-out-back;
        animation-duration: var(--motion-tab);
      }

      #screen-root.motion-forward .screen-layer.is-incoming {
        z-index: 2;
        animation-name: layer-stack-in-forward;
        animation-duration: var(--motion-stack);
      }

      #screen-root.motion-forward .screen-layer.is-outgoing {
        z-index: 1;
        animation-name: layer-stack-out-forward;
        animation-duration: var(--motion-stack);
      }

      #screen-root.motion-back .screen-layer.is-incoming {
        z-index: 1;
        animation-name: layer-stack-in-back;
        animation-duration: var(--motion-stack);
      }

      #screen-root.motion-back .screen-layer.is-outgoing {
        z-index: 2;
        animation-name: layer-stack-out-back;
        animation-duration: var(--motion-stack);
      }

      .app-screen {
        height: 100%;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
        padding: 0 18px 112px;
      }

      .app-screen::-webkit-scrollbar {
        display: none;
      }

      .status-bar {
        height: 42px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 0 6px 9px;
        color: #2c2e3d;
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.02em;
      }

      .status-icons {
        letter-spacing: 0.12em;
        font-size: 9px;
      }

      .page-header {
        min-height: 74px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .page-kicker {
        margin: 0 0 4px;
        color: var(--muted);
        font-size: 11px;
      }

      .page-title {
        margin: 0;
        color: var(--text);
        font-size: 22px;
        line-height: 1.1;
        letter-spacing: -0.035em;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .icon-button {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.78);
        box-shadow: var(--shadow-sm);
        cursor: pointer;
        transition: transform 160ms ease, background 160ms ease;
      }

      .icon-button:active {
        transform: scale(0.94);
      }

      .icon-button svg,
      .tab-icon svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .placeholder-hero {
        margin-top: 12px;
        padding: 22px;
        overflow: hidden;
        position: relative;
        border-radius: 28px;
        color: white;
        background: linear-gradient(145deg, #1b1d30, #4b4594);
        box-shadow: 0 20px 44px rgba(33, 31, 71, 0.2);
      }

      .placeholder-hero::after {
        content: '';
        width: 128px;
        height: 128px;
        position: absolute;
        right: -42px;
        bottom: -58px;
        border-radius: 42% 58% 55% 45%;
        background: linear-gradient(145deg, #8c82ff, var(--coral));
        transform: rotate(19deg);
        opacity: 0.82;
      }

      .placeholder-hero small {
        color: #bcb8e4;
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.08em;
      }

      .placeholder-hero h2 {
        max-width: 240px;
        margin: 10px 0 8px;
        font-size: 25px;
        line-height: 1.08;
        letter-spacing: -0.04em;
      }

      .placeholder-hero p {
        max-width: 245px;
        margin: 0;
        color: #d3d4dd;
        font-size: 12px;
        line-height: 1.55;
      }

      .placeholder-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 16px;
      }

      .placeholder-card {
        min-height: 104px;
        padding: 16px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: var(--shadow-sm);
      }

      .placeholder-card strong {
        display: block;
        color: var(--text);
        font-size: 14px;
      }

      .placeholder-card span {
        display: block;
        margin-top: 8px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
      }

      .nono {
        --nono-size: 58px;
        width: var(--nono-size);
        height: calc(var(--nono-size) * 0.91);
        position: relative;
        flex: none;
        border-radius: 45% 55% 48% 52% / 50% 46% 54% 50%;
        background: radial-gradient(
          circle at 29% 20%,
          #ffffff 0 8%,
          #eceaff 31%,
          #8a80ed 69%,
          #403a65 100%
        );
        box-shadow: inset -8px -9px 15px rgba(35, 31, 77, 0.3),
          inset 7px 6px 12px rgba(255, 255, 255, 0.68),
          0 12px 24px rgba(65, 57, 143, 0.24);
        animation: nono-breathe 2.4s ease-in-out infinite;
      }

      .nono::before,
      .nono::after {
        content: '';
        width: 7px;
        height: 17px;
        position: absolute;
        top: 42%;
        z-index: -1;
        border-radius: 7px;
        background: #8076df;
      }

      .nono::before {
        left: -3px;
      }

      .nono::after {
        right: -3px;
      }

      .nono-visor {
        width: 66%;
        height: 42%;
        position: absolute;
        left: 50%;
        top: 53%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20%;
        transform: translate(-50%, -50%);
        border-radius: 42% 42% 48% 48%;
        background: linear-gradient(155deg, #292a40, #11121c 68%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1),
          0 5px 12px rgba(23, 21, 47, 0.3);
      }

      .nono-eye {
        width: 8%;
        min-width: 3px;
        height: 40%;
        border-radius: 3px;
        background: var(--mint);
        box-shadow: 0 0 7px #62ddc7, 0 0 13px rgba(98, 221, 199, 0.4);
      }

      .nono-status-light {
        width: 18%;
        height: 2px;
        position: absolute;
        left: 50%;
        bottom: 13%;
        transform: translateX(-50%);
        border-radius: 99px;
        background: var(--mint);
        box-shadow: 0 0 6px var(--mint);
      }

      .nono.is-thinking .nono-eye {
        width: 16%;
        height: 18%;
        animation: nono-scan 1.1s ease-in-out infinite alternate;
      }

      .nono.is-confirm {
        filter: drop-shadow(0 0 11px rgba(255, 155, 121, 0.82));
      }

      .nono.is-confirm .nono-eye,
      .nono.is-confirm .nono-status-light,
      .nono.is-error .nono-eye,
      .nono.is-error .nono-status-light {
        background: var(--coral);
        box-shadow: 0 0 7px var(--coral);
      }

      .nono.is-success .nono-eye {
        width: 15%;
        height: 18%;
        border-bottom: 2px solid var(--mint);
        border-radius: 0 0 6px 6px;
        background: transparent;
      }

      .app-icon {
        --icon-size: 58px;
        width: var(--icon-size);
        height: var(--icon-size);
        position: relative;
        overflow: hidden;
        flex: none;
        border-radius: 30%;
        background: linear-gradient(145deg, #191b2f, #4e47ab 57%, #8e84ff);
        box-shadow: 0 14px 30px rgba(55, 49, 133, 0.26);
      }

      .app-icon::before,
      .app-icon::after {
        content: '';
        position: absolute;
        border-radius: 50%;
      }

      .app-icon::before {
        width: 66%;
        height: 66%;
        right: -22%;
        top: -18%;
        background: #8b81ff;
      }

      .app-icon::after {
        width: 43%;
        height: 43%;
        left: -14%;
        bottom: -10%;
        background: var(--coral);
      }

      .app-icon-glyph {
        width: 36%;
        height: 36%;
        position: absolute;
        left: 32%;
        top: 32%;
        z-index: 1;
        border-radius: 31% 8% 31% 8%;
        background: white;
        transform: rotate(45deg);
        box-shadow: 0 0 17px rgba(255, 255, 255, 0.65);
      }

      .home-intro {
        padding: 10px 2px 0;
      }

      .home-intro h2 {
        margin: 0;
        max-width: 310px;
        color: var(--text);
        font-size: 31px;
        line-height: 1.08;
        letter-spacing: -0.055em;
      }

      .home-intro p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .composer-card {
        margin-top: 22px;
        padding: 18px;
        border: 1px solid rgba(255, 255, 255, 0.95);
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 18px 38px rgba(34, 35, 57, 0.11);
      }

      .task-input {
        width: 100%;
        min-height: 110px;
        resize: none;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        font-size: 16px;
        line-height: 1.55;
      }

      .task-input::placeholder {
        color: #a2a4ad;
      }

      .composer-footer,
      .task-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .text-button,
      .pill-button,
      .primary-button,
      .soft-button,
      .danger-button {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 750;
        transition: transform 160ms ease, opacity 160ms ease,
          background 160ms ease;
      }

      .text-button:active,
      .pill-button:active,
      .primary-button:active,
      .soft-button:active,
      .danger-button:active {
        transform: scale(0.96);
      }

      .text-button {
        min-height: 36px;
        padding: 0 10px;
        color: var(--muted);
        background: transparent;
        font-size: 12px;
      }

      .primary-button {
        padding: 0 18px;
        color: white;
        background: var(--ink);
        box-shadow: 0 11px 20px rgba(27, 29, 48, 0.18);
        font-size: 13px;
      }

      .primary-button[disabled] {
        cursor: not-allowed;
        opacity: 0.38;
        box-shadow: none;
      }

      .soft-button {
        padding: 0 15px;
        color: #5d54cf;
        background: #ebe8ff;
        font-size: 12px;
      }

      .danger-button {
        padding: 0 15px;
        color: var(--danger);
        background: #fff0ec;
        font-size: 12px;
      }

      .section-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        margin: 24px 2px 12px;
      }

      .section-heading h3 {
        margin: 0;
        color: var(--text);
        font-size: 16px;
      }

      .section-heading span {
        color: var(--muted);
        font-size: 10px;
      }

      .suggestion-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .suggestion-chip {
        min-height: 38px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #434552;
        background: rgba(255, 255, 255, 0.8);
        box-shadow: 0 6px 15px rgba(34, 35, 54, 0.05);
        cursor: pointer;
        font-size: 11px;
      }

      .quick-task-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 14px;
      }

      .quick-task {
        min-height: 86px;
        padding: 14px;
        overflow: hidden;
        position: relative;
        text-align: left;
        border-radius: 19px;
        color: var(--text);
        cursor: pointer;
      }

      .quick-task:nth-child(1) {
        background: #ddd9ff;
      }

      .quick-task:nth-child(2) {
        background: #ffe0d6;
      }

      .quick-task:nth-child(3) {
        background: #d9efeb;
      }

      .quick-task:nth-child(4) {
        background: #efe4ff;
      }

      .quick-task strong {
        display: block;
        position: relative;
        z-index: 1;
        font-size: 13px;
      }

      .quick-task span {
        display: block;
        margin-top: 7px;
        position: relative;
        z-index: 1;
        color: #676a78;
        font-size: 10px;
      }

      .quick-task::after {
        content: '';
        width: 55px;
        height: 55px;
        position: absolute;
        right: -17px;
        bottom: -22px;
        border-radius: 16px 27px 21px 29px;
        background: linear-gradient(145deg, #8379f0, #5149aa);
        transform: rotate(20deg);
        opacity: 0.74;
      }

      .task-console {
        padding-bottom: 18px;
      }

      .task-main-card {
        margin-top: 10px;
        padding: 19px;
        border-radius: 26px;
        color: white;
        background: radial-gradient(
            circle at 95% 5%,
            #5b53b6 0,
            transparent 35%
          ),
          linear-gradient(145deg, #1b1d30, #292946);
        box-shadow: 0 20px 46px rgba(24, 25, 43, 0.24);
      }

      .task-state-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .task-state-copy small {
        color: #aaa5e9;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      .task-state-copy h2 {
        margin: 7px 0 5px;
        font-size: 20px;
        line-height: 1.15;
      }

      .task-state-copy p {
        margin: 0;
        color: #c4c6d1;
        font-size: 11px;
        line-height: 1.5;
      }

      .progress-track {
        height: 7px;
        margin-top: 18px;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.13);
      }

      .progress-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--violet), var(--mint));
        transition: width 260ms ease;
      }

      .progress-meta {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        color: #aeb0bc;
        font-size: 9px;
      }

      .state-callout {
        margin-top: 13px;
        padding: 14px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.09);
        border: 1px solid rgba(255, 255, 255, 0.09);
      }

      .state-callout.is-attention {
        color: #40231d;
        background: #ffd9cf;
        border-color: #ffe8e2;
      }

      .state-callout strong {
        display: block;
        font-size: 12px;
      }

      .state-callout span {
        display: block;
        margin-top: 5px;
        color: inherit;
        opacity: 0.78;
        font-size: 10px;
        line-height: 1.5;
      }

      .timeline-list {
        display: grid;
        gap: 9px;
      }

      .timeline-item {
        display: grid;
        grid-template-columns: 30px 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 11px 12px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.84);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 8px 20px rgba(32, 33, 53, 0.05);
      }

      .timeline-index {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        color: #777a87;
        background: #efedf7;
        font-size: 10px;
        font-weight: 800;
      }

      .timeline-item.is-complete .timeline-index {
        color: var(--success);
        background: #dcf2ec;
      }

      .timeline-item.is-current .timeline-index {
        color: white;
        background: var(--violet);
      }

      .timeline-copy strong {
        display: block;
        color: var(--text);
        font-size: 12px;
      }

      .timeline-copy span,
      .timeline-state {
        color: var(--muted);
        font-size: 9px;
      }

      .timeline-copy span {
        display: block;
        margin-top: 3px;
      }

      .demo-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
        padding: 12px;
        border: 1px dashed #cfcbe8;
        border-radius: 18px;
        background: rgba(245, 243, 253, 0.78);
      }

      .demo-controls::before {
        content: '原型演示控制';
        width: 100%;
        color: #77718e;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.07em;
      }

      .pill-button {
        min-height: 35px;
        padding: 0 11px;
        color: #4d4f5d;
        background: white;
        border: 1px solid var(--line);
        font-size: 10px;
      }

      .sr-only {
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        position: absolute;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .status-preview {
        padding: 4px 8px;
        border-radius: 999px;
        color: #5b54bd;
        background: #e9e6ff;
        cursor: pointer;
        font-size: 9px;
        font-weight: 800;
      }

      .subpage-header {
        min-height: 58px;
        display: grid;
        grid-template-columns: 42px 1fr 42px;
        align-items: center;
      }

      .subpage-header h1 {

      .form-card,

      .card-topline,
      .card-actions,
      .setting-row,
      .activity-meta,
      .filter-row {
        display: flex;

      .card-copy strong,
      .setting-copy strong {

      }

      .card-copy span,
      .setting-copy span {

      .status-badge {
        padding: 5px 8px;
        border-radius: 999px;
        color: #5d55cb;
        background: #e9e6ff;
        font-size: 8px;

      }

      .status-badge.is-success {

      }

      .status-badge.is-danger {
        color: var(--danger);

      }

      .card-actions {
        justify-content: flex-start;

      .mini-button {

      .filter-row {

      .filter-chip {

      .activity-card {

      .toggle {

      .toggle::after {

      .link-row {

      .log-item {

      .about-mark {
        display: grid;
        place-items: center;

      .about-mark h2,

      .about-mark p {

      .overlay-widget {
        width: 66px;
        height: 66px;

      .overlay-widget.is-peeking[data-side='left'] {

      .overlay-widget.is-peeking[data-side='right'] {
        transform: translateX(40%);

      .overlay-bubble {
        width: 66px;
        height: 66px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 2px solid rgba(255, 255, 255, 0.92);

        background: rgba(27, 29, 48, 0.94);
        box-shadow: 0 15px 32px rgba(25, 26, 46, 0.32);

      .overlay-bubble:active {

      .overlay-widget.is-attention .overlay-bubble {

      .overlay-card {
        width: 250px;

        padding: 15px;

      .overlay-widget[data-side='right'] .overlay-card {

      .overlay-widget[data-side='left'] .overlay-card {

        display: block;

      }

      .overlay-progress span,
      .notification-progress span {

      .overlay-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;

      }

      .overlay-actions button {
        min-height: 36px;
        border-radius: 11px;

        background: rgba(255, 255, 255, 0.1);
        cursor: pointer;
        font-size: 9px;
        font-weight: 750;
      }

      .overlay-actions .is-danger {
        color: #ffd4c8;
        background: rgba(255, 155, 121, 0.18);
      }

      .notification-peek {
        position: absolute;
        top: 8px;
        right: 15px;
        padding: 7px 10px;
        pointer-events: auto;
        border-radius: 999px;
        color: white;
        background: rgba(27, 29, 48, 0.9);
        box-shadow: 0 7px 18px rgba(25, 26, 43, 0.2);
        cursor: pointer;

        font-weight: 800;
      }

      .notification-shade {
        position: absolute;
        inset: 0;
        padding: 46px 12px 0;
        pointer-events: auto;
        background: linear-gradient(
          180deg,
          rgba(34, 35, 53, 0.68),

        );

      .notification-card {

        color: var(--text);

      .notification-title {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .notification-title strong {
        display: block;
        font-size: 12px;
      }

      .notification-title span {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 9px;
      }

      .notification-card p {
        margin: 11px 0;
        color: #5f616e;
        font-size: 10px;
        line-height: 1.45;
      }

      .notification-card .overlay-actions button {
        color: #5149ad;
        background: #eeecff;
      }

      .notification-card .overlay-actions .is-danger {
        color: var(--danger);
        background: #fff0ec;
      }

      .modal-backdrop {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: flex-end;
        padding: 14px;
        pointer-events: auto;
        background: rgba(19, 20, 34, 0.42);
        backdrop-filter: blur(5px);
      }

      .modal-sheet {
        width: 100%;
        padding: 20px;
        border-radius: 26px;
        color: white;
        background: var(--ink);
        box-shadow: 0 22px 52px rgba(18, 19, 33, 0.36);
      }

      .modal-grab {
        width: 38px;
        height: 4px;
        margin: 0 auto 16px;
        border-radius: 99px;
        background: #555869;
      }

      .modal-sheet h2 {
        margin: 0;
        font-size: 18px;
      }

      .modal-sheet p {
        margin: 8px 0 18px;
        color: #c4c6d0;
        font-size: 12px;
        line-height: 1.55;
      }

      .modal-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }

      .modal-actions button {
        min-height: 44px;
        border-radius: 14px;
        cursor: pointer;
        font-weight: 750;
      }

      .modal-cancel {
        color: white;
        background: rgba(255, 255, 255, 0.1);
      }

      .modal-confirm {
        color: #4c271f;
        background: var(--coral);
      }

      .toast {
        max-width: calc(100% - 28px);
        position: absolute;
        left: 50%;
        top: 54px;
        transform: translateX(-50%);
        padding: 11px 14px;
        pointer-events: auto;
        border-radius: 14px;
        color: white;
        background: rgba(27, 29, 48, 0.94);
        box-shadow: 0 12px 26px rgba(21, 22, 38, 0.23);
        font-size: 11px;
        line-height: 1.4;
      }

      #tab-bar {
        --active-tab-index: 0;
        height: 76px;
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 20;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        align-items: center;
        padding: 7px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 24px;
        background: rgba(27, 29, 48, 0.95);
        box-shadow: 0 16px 32px rgba(20, 21, 36, 0.22);
        backdrop-filter: blur(18px);
        isolation: isolate;
      }

      .tab-indicator {
        width: calc((100% - 14px) / 4);
        position: absolute;
        left: 7px;
        top: 7px;
        bottom: 7px;
        z-index: 0;
        pointer-events: none;
        border-radius: 18px;
        background: linear-gradient(145deg, #8178f5, var(--violet));
        box-shadow: 0 9px 20px rgba(82, 72, 199, 0.34);
        transform: translateX(calc(var(--active-tab-index) * 100%));
        transition: transform var(--motion-tab) var(--motion-ease);
      }

      .tab-button {
        min-width: 0;
        height: 62px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        position: relative;
        z-index: 1;
        border-radius: 18px;
        color: #858896;
        background: transparent;
        cursor: pointer;
        transition: color 200ms ease, transform 160ms ease;
      }

      .tab-button:active {
        transform: scale(0.94);
      }

      .tab-button[aria-current='page'] {
        color: white;
        background: transparent;
      }

      .tab-icon {
        display: grid;
        transition: transform var(--motion-tab) var(--motion-ease);
      }

      .tab-button[aria-current='page'] .tab-icon {
        transform: translateY(-2px) scale(1.08);
      }

      .tab-label {
        font-size: 10px;
        font-weight: 700;
      }

      #overlay-layer,
      #notification-layer,
      #modal-root,
      #toast-root {
        position: absolute;
        inset: 0;
        z-index: 30;
        pointer-events: none;
      }

      #notification-layer {
        z-index: 35;
      }

      #modal-root {
        z-index: 50;
      }

      #toast-root {
        z-index: 60;
      }

      @keyframes layer-tab-in-forward {
        from {
          opacity: 0.55;
          transform: translate3d(28%, 0, 0) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes layer-tab-out-forward {
        from {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
        to {
          opacity: 0.48;
          transform: translate3d(-12%, 0, 0) scale(0.985);
        }
      }

      @keyframes layer-tab-in-back {
        from {
          opacity: 0.55;
          transform: translate3d(-28%, 0, 0) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes layer-tab-out-back {
        from {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
        to {
          opacity: 0.48;
          transform: translate3d(12%, 0, 0) scale(0.985);
        }
      }

      @keyframes layer-stack-in-forward {
        from {
          transform: translate3d(100%, 0, 0);
        }
        to {
          transform: translate3d(0, 0, 0);
        }
      }

      @keyframes layer-stack-out-forward {
        from {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
        to {
          opacity: 0.72;
          transform: translate3d(-8%, 0, 0) scale(0.97);
        }
      }

      @keyframes layer-stack-in-back {
        from {
          opacity: 0.72;
          transform: translate3d(-8%, 0, 0) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes layer-stack-out-back {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(100%, 0, 0);
        }
      }

      @keyframes nono-breathe {
        50% {
          transform: translateY(-3px) rotate(1deg);
        }
      }

      @keyframes nono-scan {
        to {
          transform: translateX(3px);
        }
      }

      @media (max-width: 560px) {
        #app {
          display: block;
          padding: 0;
        }

        #app::before,
        #app::after {
          display: none;
        }

        #phone-shell {
          width: 100vw;
          height: 100dvh;
          min-height: 560px;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }
      }

      @media (max-height: 700px) and (min-width: 561px) {
        #app {
          padding: 12px;
        }

        #phone-shell {
          height: calc(100vh - 24px);
          min-height: 580px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }

        .tab-indicator,
        .tab-icon {
          transition: none !important;
        }

        .screen-layer.is-incoming,
        .screen-layer.is-outgoing {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="phone-shell">
        <div id="screen-root">
          <div
            class="screen-layer is-current"
            data-screen-layer="current"></div>
        </div>
        <nav id="tab-bar" aria-label="主导航"></nav>
        <div id="overlay-layer"></div>
        <div id="notification-layer"></div>
        <div id="modal-root"></div>
        <div id="toast-root" aria-live="polite"></div>
      </div>
    </div>

    <script>
      const appState = {
        route: 'home',
        stack: [],
        viewData: {},
        taskInput: '',
        task: null,
        activeModelId: 'model-nono',
        models: [
          {
            id: 'model-nono',
            name: 'NoNo Vision',
            provider: 'Pearl AI',
            endpoint: 'gateway.example.ai/v1',
            modelId: 'nono-vision-2',
            apiKey: 'demo-key-masked',
          },
          {
            id: 'model-sage',
            name: 'Sage Mini',
            provider: 'Cloud Lab',
            endpoint: 'models.example.ai/v1',
            modelId: 'sage-mini',
            apiKey: 'demo-key-masked',
          },
        ],
        activities: [
          {
            id: 'seed-success',
            instruction: '整理本周的重要通知并生成摘要',
            status: 'succeeded',
            stepCount: 5,
            createdAt: '2026-08-17T09:22:00.000Z',
            summary: '已整理 8 条演示通知，并按重要性归类',
          },
          {
            id: 'seed-failed',
            instruction: '比较三家平台的耳机价格',
            status: 'failed',
            stepCount: 2,
            createdAt: '2026-08-16T18:40:00.000Z',
            summary: '演示模型连接中断，未产生外部操作',
          },
        ],
        activityFilter: 'all',
        settings: {
          completionSound: true,
          autoHistory: true,
          adbFallback: false,
        },
        permissions: {
          overlay: true,
          notification: true,
          accessibility: true,
        },
        overlay: {visible: false, expanded: false, x: null, y: 180},
        notificationTrayOpen: false,
        modal: null,
        toast: null,
      };

      const DEMO_STEPS = [
        '打开目标应用',
        '搜索并筛选内容',
        '读取详情并比较',
        '等待你的确认',
        '完成最后操作',
      ];

      let toastTimer = 0;
      let overlayPeekTimer = 0;
      let overlayDrag = null;
      let modalReturnFocus = null;
      let activeLayerTransition = null;

      function escapeHtml(value) {
        return String(value ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      function showToast(message, tone = 'info') {
        appState.toast = {message, tone};
        clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => {
          appState.toast = null;
          renderToast();
        }, 2600);
        renderToast();
      }

      function createDemoTask(instruction) {
        const cleanInstruction = String(instruction || '').trim();
        if (!cleanInstruction) {
          showToast('请先告诉 NoNo 你想完成什么', 'warning');
          return null;
        }
        if (!appState.activeModelId) {
          showToast('请先选择一个可用模型', 'warning');
          navigate('models');
          return null;
        }
        appState.task = {
          id: `demo-${Date.now()}`,
          instruction: cleanInstruction,
          status: 'running',
          stepIndex: 0,
          steps: [...DEMO_STEPS],
          startedAt: Date.now(),
          result: null,
          error: null,
        };
        appState.taskInput = cleanInstruction;
        appState.overlay.visible = true;
        renderApp();
        return appState.task;
      }

      function advanceTask() {
        const task = appState.task;
        if (!task || task.status !== 'running') return;
        if (task.stepIndex === 2) {
          task.status = 'needs_confirmation';
        } else if (task.stepIndex >= task.steps.length - 1) {
          finishTask('succeeded');
          return;
        } else {
          task.stepIndex += 1;
        }
        renderApp();
      }

      function resolveConfirmation(approved) {
        const task = appState.task;
        if (!task || task.status !== 'needs_confirmation') return;
        if (!approved) {
          finishTask('cancelled');
          return;
        }
        task.stepIndex = 3;
        task.status = 'running';
        showToast('已确认，NoNo 将继续执行', 'success');
        renderApp();
      }

      function finishTask(kind) {
        const task = appState.task;
        if (!task) return;
        const terminalKinds = ['succeeded', 'failed', 'cancelled'];
        if (!terminalKinds.includes(kind)) return;
        task.status = kind;
        task.finishedAt = Date.now();
        task.result = kind === 'succeeded' ? '演示任务已安全完成' : null;
        task.error =
          kind === 'failed' ? '模型服务暂时不可用，请稍后重试' : null;
        appState.overlay.visible = false;
        const exists = appState.activities.some(item => item.id === task.id);
        if (!exists && appState.settings.autoHistory !== false) {
          appState.activities.unshift({
            id: task.id,
            instruction: task.instruction,
            status: kind,
            stepCount: task.stepIndex + 1,
            createdAt: new Date(task.startedAt).toISOString(),
            summary:
              kind === 'succeeded'
                ? '任务完成，演示结果已生成'
                : kind === 'failed'
                ? '任务未完成，可检查模型设置后重试'
                : '任务已由用户终止',
          });
        }
        showToast(
          kind === 'succeeded'
            ? 'NoNo 已完成任务'
            : kind === 'failed'
            ? '任务执行失败，输入已保留'
            : '任务已安全终止',
          kind === 'succeeded' ? 'success' : 'warning',
        );
        renderApp();
      }

      function requestTaskStop(source = 'app') {
        if (!appState.task) return;
        appState.modal = {
          type: 'stop-task',
          source,
          title: '确定终止当前任务？',

            'NoNo 会停止后续操作；已经在其他应用中完成的操作无法自动撤销。',
        };
        renderModal();
      }

      function getTaskProgress() {
        const task = appState.task;
        if (!task) return 0;
        return Math.min(
          100,
          Math.round(((task.stepIndex + 0.5) / task.steps.length) * 100),
        );
      }

      function beginOverlayDrag(event) {
        const bubble = event.target.closest('[data-overlay-bubble]');
        if (!bubble) return;
        const widget = bubble.closest('[data-overlay-widget]');
        appState.overlay.peek = false;
        clearTimeout(overlayPeekTimer);
        overlayDrag = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          originX: appState.overlay.x,
          originY: appState.overlay.y,
          moved: false,
          widget,
        };
        try {
          bubble.setPointerCapture(event.pointerId);
        } catch {
          /* Browser harnesses may not implement pointer capture. */
        }
      }

      function moveOverlay(event) {
        if (!overlayDrag || event.pointerId !== overlayDrag.pointerId) return;
        const deltaX = event.clientX - overlayDrag.startX;
        const deltaY = event.clientY - overlayDrag.startY;
        overlayDrag.moved ||= Math.hypot(deltaX, deltaY) >= 5;
        if (!overlayDrag.moved) return;
        const shell = document.getElementById('phone-shell');
        appState.overlay.x = Math.min(
          shell.clientWidth - 78,
          Math.max(12, overlayDrag.originX + deltaX),
        );
        appState.overlay.y = Math.min(
          shell.clientHeight - 162,
          Math.max(62, overlayDrag.originY + deltaY),
        );
        overlayDrag.widget.style.left = `${appState.overlay.x}px`;
        overlayDrag.widget.style.top = `${appState.overlay.y}px`;
      }

      function endOverlayDrag(event) {
        if (!overlayDrag || event.pointerId !== overlayDrag.pointerId) return;
        const moved = overlayDrag.moved;
        overlayDrag = null;
        if (moved) {
          appState.overlay.ignoreClickUntil = performance.now() + 250;
          snapOverlayToEdge();
        } else {
          scheduleOverlayPeek();
        }
      }

      function snapOverlayToEdge() {
        const shell = document.getElementById('phone-shell');
        const maxX = Math.max(12, shell.clientWidth - 78);
        appState.overlay.side =
          appState.overlay.x < maxX / 2 ? 'left' : 'right';
        appState.overlay.x = appState.overlay.side === 'left' ? 12 : maxX;
        renderOverlay();

      function scheduleOverlayPeek() {
        clearTimeout(overlayPeekTimer);
        if (
          appState.overlay.expanded ||
          appState.overlay.peek ||
          !appState.overlay.visible

        overlayPeekTimer = window.setTimeout(() => {

      function sanitizeOutgoingLayer(layer) {
        layer.className = 'screen-layer is-outgoing';
        layer.removeAttribute('data-screen-layer');
        layer.setAttribute('aria-hidden', 'true');
        layer.inert = true;
        layer
          .querySelectorAll('[id]')
          .forEach(element => element.removeAttribute('id'));
        layer
          .querySelectorAll(
            '[for], [aria-labelledby], [aria-describedby], [aria-controls]',
          )
          .forEach(element => {
            element.removeAttribute('for');

          .querySelectorAll('a, button, input, select, textarea, [tabindex]')

      function finishLayerTransition(transition = activeLayerTransition) {
        if (!transition || transition !== activeLayerTransition) return;
        window.clearTimeout(transition.timer);
        transition.incoming.removeEventListener(
          'animationend',
          transition.finish,
        );
        transition.incoming.removeEventListener(
          'animationcancel',
          transition.finish,
        );
        transition.outgoing.remove();
        transition.incoming.classList.remove('is-incoming');
        transition.root.classList.remove(
          'is-layer-transitioning',
          'motion-tab-forward',
          'motion-tab-back',
          'motion-forward',
          'motion-back',
        );
        activeLayerTransition = null;
      }

      function runLayerTransition(mutator, direction = 'forward') {
        finishLayerTransition();
        const root = document.getElementById('screen-root');
        const current = root.querySelector('[data-screen-layer="current"]');
        const reduceMotion = window.matchMedia?.(
          '(prefers-reduced-motion: reduce)',
        ).matches;

        if (reduceMotion) {
          mutator();
          renderApp();
          return;
        }

        const outgoing = current.cloneNode(true);
        const previousScroll =
          current.querySelector('.app-screen')?.scrollTop || 0;
        sanitizeOutgoingLayer(outgoing);
        root.append(outgoing);
        const outgoingScroller = outgoing.querySelector('.app-screen');
        if (outgoingScroller) outgoingScroller.scrollTop = previousScroll;

        mutator();
        renderApp();
        current.classList.add('is-incoming');
        root.classList.add('is-layer-transitioning');
        void root.offsetWidth;
        root.classList.add(`motion-${direction}`);

        const transition = {
          root,
          incoming: current,
          outgoing,
          timer: 0,
          finish: null,
        };
        transition.finish = event => {
          if (event && event.target !== current) return;
          finishLayerTransition(transition);
        };
        current.addEventListener('animationend', transition.finish);
        current.addEventListener('animationcancel', transition.finish);
        transition.timer = window.setTimeout(
          transition.finish,
          direction.startsWith('tab-') ? 380 : 420,
        );
        activeLayerTransition = transition;
      }

        if (appState.route === route && appState.stack.length === 0) return;
        const currentIndex = TAB_ROUTES.indexOf(getActiveTab());

        const direction =
          nextIndex === currentIndex
            ? 'back'
            : nextIndex > currentIndex
            ? 'tab-forward'
            : 'tab-back';
        runLayerTransition(() => {
          appState.route = route;
          appState.stack = [];
          appState.viewData = {};
        }, direction);
      }

      function goBack() {
        runLayerTransition(() => {
          const previous = appState.stack.pop();
          appState.route = previous || 'home';
          appState.viewData = {};
        }, 'back');

          appState.stack.push(appState.route);

      function saveModel(form) {

        const errors = {};

          'endpoint',
          'modelId',
          'apiKey',
        ]) {
          if (!String(values[name] || '').trim()) errors[name] = '此项不能为空';

        if (values.endpoint && !String(values.endpoint).includes('.')) {
          errors.endpoint = '请输入有效的演示服务地址';

        if (Object.keys(errors).length) {
          appState.viewData = {
            ...appState.viewData,
            draft: values,
            errors,
          };
          renderApp();
          document
            .querySelector('.field-error')
            ?.previousElementSibling?.focus();
          return;

        const mode = form.dataset.mode;
        if (mode === 'edit') {
          const index = appState.models.findIndex(
            model => model.id === form.dataset.id,
          );
          if (index >= 0)
            appState.models[index] = {id: form.dataset.id, ...values};

          appState.models.push({id, ...values});

      function renderTaskConsole() {
        const task = appState.task;

        const stateMeta = {
          running: ['NoNo 正在执行', '正在安全地完成当前步骤'],
          needs_confirmation: ['需要你的确认', '关键操作不会在未经允许时继续'],

          cancelled: ['任务已终止', 'NoNo 已停止执行后续步骤'],
        }[task.status] || ['NoNo 正在准备', '即将开始执行'];
        const terminal = ['succeeded', 'failed', 'cancelled'].includes(
          task.status,
        );
        const progress = terminal
          ? task.status === 'succeeded'
            ? 100
            : Math.round(((task.stepIndex + 1) / task.steps.length) * 100)
          : Math.round(((task.stepIndex + 0.5) / task.steps.length) * 100);
        return `
          <main class="app-screen task-console" data-route="home">
            <div class="status-bar"><span>9:41</span><button class="status-preview" type="button" data-action="toggle-notification-tray">通知预览</button></div>

                ${renderNoNo(task.status, 66)}
              </div>
              <div class="progress-track" aria-label="任务进度"><div class="progress-fill" style="width:${progress}%"></div></div>
              <div class="progress-meta"><span>步骤 ${Math.min(
                task.stepIndex + 1,
                task.steps.length,
              )} / ${task.steps.length}</span><span>${progress}%</span></div>
              ${
                task.status === 'needs_confirmation'
                  ? '<div class="state-callout is-attention"><strong>即将执行关键操作</strong><span>示例：提交订单、发送信息或修改系统设置前，需要你明确确认。</span></div>'
                  : ''
              }
              ${
                task.status === 'manual_takeover'
                  ? '<div class="state-callout is-attention"><strong>需要手动完成验证</strong><span>请在目标应用完成验证码或登录，完成后点击“交还给 NoNo”。</span></div>'
                  : ''
              }
              ${
                task.error
                  ? `<div class="state-callout is-attention"><strong>发生问题</strong><span>${escapeHtml(
                      task.error,
                    )}</span></div>`
                  : ''
              }
            </section>
            <section class="demo-controls" aria-label="原型演示控制">
              ${
                task.status === 'running'
                  ? '<button class="pill-button" type="button" data-action="advance-task">推进一步</button><button class="pill-button" type="button" data-action="simulate-takeover">模拟接管</button><button class="pill-button" type="button" data-action="simulate-error">模拟失败</button>'
                  : ''
              }
              ${
                task.status === 'needs_confirmation'
                  ? '<button class="primary-button" type="button" data-action="confirm-task">确认执行</button><button class="soft-button" type="button" data-action="reject-task">拒绝</button>'
                  : ''
              }
              ${
                task.status === 'manual_takeover'
                  ? '<button class="primary-button" type="button" data-action="complete-takeover">交还给 NoNo</button>'
                  : ''
              }
              ${
                !terminal
                  ? '<button class="danger-button" type="button" data-action="request-stop-task">终止</button>'
                  : '<button class="primary-button" type="button" data-action="new-task">新任务</button><button class="soft-button" type="button" data-action="rerun-current">再次执行</button>'
              }
            </section>
            <div class="section-heading"><h3>执行时间线</h3><span>${escapeHtml(
              task.instruction,
            )}</span></div>
            <section class="timeline-list">
              ${task.steps
                .map((step, index) => {
                  const complete =
                    task.status === 'succeeded' || index < task.stepIndex;
                  const current = !terminal && index === task.stepIndex;
                  return `<article class="timeline-item ${
                    complete ? 'is-complete' : current ? 'is-current' : ''
                  }"><span class="timeline-index">${
                    complete ? '✓' : index + 1
                  }</span><span class="timeline-copy"><strong>${step}</strong><span>${
                    complete ? '已完成' : current ? '正在处理' : '等待中'
                  }</span></span><span class="timeline-state">${
                    complete ? 'DONE' : current ? 'NOW' : 'NEXT'
                  }</span></article>`;
                })
                .join('')}
            </section>
          </main>`;
      }

      function dispatchAction(action, target) {
        const routes = {
          'nav-home': 'home',
          'nav-models': 'models',
          'nav-activity': 'activity',
          'nav-settings': 'settings',
        };
        if (routes[action]) navigate(routes[action]);
        else if (action === 'go-back') goBack();
        else if (action === 'toggle-overlay') {
          if (performance.now() < (appState.overlay.ignoreClickUntil || 0)) {
            return;
          }
          appState.overlay.peek = false;
          appState.overlay.expanded = !appState.overlay.expanded;
          renderOverlay();
        } else if (action === 'surface-open-task') {
          openTaskFromSurface(target.dataset.source);
        } else if (action === 'surface-request-stop') {
          appState.notificationTrayOpen = false;
          requestTaskStop(target.dataset.source);
          renderNotification();
        } else if (action === 'toggle-notification-tray') {
          appState.notificationTrayOpen = !appState.notificationTrayOpen;
          renderNotification();
        } else if (action === 'add-model') {
          openSecondary('model-form', {mode: 'add'});
        } else if (action === 'edit-model') {
          openSecondary('model-form', {mode: 'edit', id: target.dataset.id});
        } else if (action === 'select-model') {
          appState.activeModelId = target.dataset.id;
          showToast('NoNo 已切换到新模型', 'success');
          renderApp();
        } else if (action === 'delete-model') {
          const model = appState.models.find(
            item => item.id === target.dataset.id,
          );
          appState.modal = {
            type: 'delete-model',
            id: target.dataset.id,
            title: '删除这个模型配置？',
            message: `${
              model?.name || '该模型'
            } 将从本次演示中移除。此操作不会影响任何真实服务。`,
          };
          renderModal();
        } else if (action === 'confirm-delete-model') {
          const id = appState.modal?.id;
          appState.models = appState.models.filter(model => model.id !== id);
          if (appState.activeModelId === id) {
            appState.activeModelId = appState.models[0]?.id || null;
          }
          appState.modal = null;
          modalReturnFocus = null;
          showToast('模型配置已删除', 'warning');
          renderApp();
        } else if (action === 'save-model') {
          saveModel(document.getElementById('model-form'));
        } else if (action === 'open-api-guide') {
          openSecondary('api-guide');
        } else if (action === 'filter-activity') {
          appState.activityFilter = target.dataset.filter;
          renderApp();
        } else if (action === 'open-task-detail') {
          openSecondary('task-detail', {id: target.dataset.id});
        } else if (action === 'rerun-task') {
          const activity = appState.activities.find(
            item => item.id === target.dataset.id,
          );
          appState.route = 'home';
          appState.stack = [];
          createDemoTask(activity?.instruction);
        } else if (action === 'toggle-setting') {
          const key = target.dataset.key;
          appState.settings[key] = !appState.settings[key];
          showToast('设置已更新', 'success');
          renderApp();
        } else if (action === 'toggle-permission') {
          const key = target.dataset.key;
          appState.permissions[key] = !appState.permissions[key];
          showToast(
            appState.permissions[key]
              ? '演示权限已开启'
              : '演示权限已关闭，相关界面已降级',
            appState.permissions[key] ? 'success' : 'warning',
          );
          renderApp();
        } else if (action === 'open-debug-logs') {
          openSecondary('debug-logs');
        } else if (action === 'open-about') {
          openSecondary('about');
        } else if (action === 'choose-suggestion') {
          appState.taskInput = target.dataset.value || '';
          renderApp();
          document.getElementById('task-input')?.focus();
        } else if (action === 'clear-task-input') {
          appState.taskInput = '';
          renderApp();
        } else if (action === 'start-task') {
          createDemoTask(document.getElementById('task-input')?.value);
        } else if (action === 'advance-task') advanceTask();
        else if (action === 'confirm-task') resolveConfirmation(true);
        else if (action === 'reject-task') resolveConfirmation(false);
        else if (action === 'simulate-takeover' && appState.task) {
          appState.task.status = 'manual_takeover';
          renderApp();
        } else if (action === 'complete-takeover' && appState.task) {
          appState.task.status = 'running';
          appState.task.stepIndex = Math.min(
            appState.task.stepIndex + 1,
            appState.task.steps.length - 1,
          );
          showToast('已接回任务，NoNo 继续执行', 'success');
          renderApp();
        } else if (action === 'simulate-error') finishTask('failed');
        else if (action === 'request-stop-task') requestTaskStop('app');
        else if (action === 'cancel-modal') {
          closeModal();
        } else if (action === 'confirm-stop-task') {
          appState.modal = null;
          modalReturnFocus = null;
          finishTask('cancelled');
        } else if (action === 'new-task') {
          appState.task = null;
          appState.taskInput = '';
          renderApp();
        } else if (action === 'rerun-current' && appState.task) {
          createDemoTask(appState.task.instruction);
        } else if (action === 'reset-demo') location.reload();
      }

      document.addEventListener('click', event => {
        const target = event.target.closest('[data-action]');
        if (target) dispatchAction(target.dataset.action, target);
        if (!event.target.closest('[data-overlay-widget]')) collapseOverlay();
      });

      document.addEventListener('pointerdown', beginOverlayDrag);
      document.addEventListener('pointermove', moveOverlay);
      document.addEventListener('pointerup', endOverlayDrag);
      document.addEventListener('pointercancel', endOverlayDrag);

      document.addEventListener('input', event => {
        if (event.target.id !== 'task-input') return;
        appState.taskInput = event.target.value;
        const button = document.querySelector('[data-action="start-task"]');
        if (button) button.disabled = !appState.taskInput.trim();
      });

      document.addEventListener('keydown', event => {
        if (!appState.modal) return;
        if (event.key === 'Escape') {
          event.preventDefault();
          closeModal();
          return;
        }
        if (event.key !== 'Tab') return;
        const dialog = document.querySelector('[role="dialog"]');
        const controls = [...dialog.querySelectorAll('button')].filter(
          element => !element.disabled,
        );
        if (!controls.length) return;
        const first = controls[0];
        const last = controls[controls.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });

      renderApp();
    </script>
  </body>
</html>
