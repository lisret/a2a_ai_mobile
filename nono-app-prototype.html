<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NoNo 全应用交互原型</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1b1d30;
        --pearl: #f8f7f3;
        --cloud: #f1effa;
        --violet: #756bf0;
        --mint: #8df4e2;
        --coral: #ff9b79;
        --text: #202231;
        --muted: #777a88;
        --line: #e8e7ed;
        --white: #ffffff;
        --danger: #a94e40;
        --success: #267568;
        --shadow-sm: 0 10px 28px rgba(30, 31, 54, 0.08);
        --shadow-lg: 0 28px 80px rgba(31, 29, 65, 0.18);
        --radius-card: 24px;
        --radius-control: 16px;
        --motion-tab: 280ms;
        --motion-stack: 320ms;
        --motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: #dfdcf5;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        background: radial-gradient(
            circle at 18% 20%,
            #ffffff 0 5%,
            transparent 28%
          ),
          radial-gradient(circle at 83% 78%, #bdb7ff 0 2%, transparent 31%),
          linear-gradient(145deg, #e8e5ff 0%, #d8d5f6 48%, #cbc7f0 100%);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
          'PingFang SC', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
      }

      button,
      [role='button'] {
        -webkit-tap-highlight-color: transparent;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      [tabindex]:focus-visible {
        outline: 3px solid rgba(117, 107, 240, 0.44);
        outline-offset: 3px;
      }

      #app {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        position: relative;
      }

      #app::before,
      #app::after {
        content: '';
        position: fixed;
        pointer-events: none;
        border-radius: 42% 58% 52% 48%;
        filter: blur(2px);
        opacity: 0.5;
      }

      #app::before {
        width: 260px;
        height: 260px;
        left: -90px;
        top: 9vh;
        background: linear-gradient(145deg, #938aff, #7167d9);
        transform: rotate(24deg);
      }

      #app::after {
        width: 190px;
        height: 190px;
        right: -55px;
        bottom: 7vh;
        background: linear-gradient(145deg, #ffb39d, #ff8f72);
        transform: rotate(-21deg);
      }

      #phone-shell {
        width: min(390px, calc(100vw - 32px));
        height: min(844px, calc(100vh - 48px));
        min-height: 620px;
        position: relative;
        overflow: hidden;
        isolation: isolate;
        border-radius: 44px;
        background: var(--pearl);
        border: 7px solid rgba(255, 255, 255, 0.88);
        box-shadow: var(--shadow-lg), inset 0 0 0 1px rgba(31, 32, 49, 0.06);
      }

      #screen-root {
        height: 100%;
        position: relative;
        overflow: hidden;
        isolation: isolate;
        contain: paint;
        background: radial-gradient(
            circle at 92% 2%,
            #e5e1ff 0,
            transparent 30%
          ),
          linear-gradient(165deg, #fbfaf7 0%, var(--pearl) 54%, #f2effb 100%);
      }

      .screen-layer {
        position: absolute;
        inset: 0;
        height: 100%;
        overflow: hidden;
        background: inherit;
        transform: translate3d(0, 0, 0);
        backface-visibility: hidden;
        will-change: transform, opacity;
      }

      .screen-layer.is-current {
        z-index: 1;
      }

      #screen-root.is-layer-transitioning .screen-layer {
        pointer-events: none;
      }

      .screen-layer.is-incoming,
      .screen-layer.is-outgoing {
        animation-timing-function: var(--motion-ease);
        animation-fill-mode: both;
      }

      #screen-root.motion-tab-forward .screen-layer.is-incoming {
        z-index: 2;
        animation-name: layer-tab-in-forward;
        animation-duration: var(--motion-tab);
      }

      #screen-root.motion-tab-forward .screen-layer.is-outgoing {
        z-index: 1;
        animation-name: layer-tab-out-forward;
        animation-duration: var(--motion-tab);
      }

      #screen-root.motion-tab-back .screen-layer.is-incoming {
        z-index: 2;
        animation-name: layer-tab-in-back;
        animation-duration: var(--motion-tab);
      }

      #screen-root.motion-tab-back .screen-layer.is-outgoing {
        z-index: 1;
        animation-name: layer-tab-out-back;
        animation-duration: var(--motion-tab);
      }

      #screen-root.motion-forward .screen-layer.is-incoming {
        z-index: 2;
        animation-name: layer-stack-in-forward;
        animation-duration: var(--motion-stack);
      }

      #screen-root.motion-forward .screen-layer.is-outgoing {
        z-index: 1;
        animation-name: layer-stack-out-forward;
        animation-duration: var(--motion-stack);
      }

      #screen-root.motion-back .screen-layer.is-incoming {
        z-index: 1;
        animation-name: layer-stack-in-back;
        animation-duration: var(--motion-stack);
      }

      #screen-root.motion-back .screen-layer.is-outgoing {
        z-index: 2;
        animation-name: layer-stack-out-back;
        animation-duration: var(--motion-stack);
      }

      .app-screen {
        height: 100%;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
        padding: 0 18px 112px;
      }

      .app-screen::-webkit-scrollbar {
        display: none;
      }

      .status-bar {
        height: 42px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 0 6px 9px;
        color: #2c2e3d;
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.02em;
      }

      .status-icons {
        letter-spacing: 0.12em;
        font-size: 9px;
      }

      .page-header {
        min-height: 74px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .page-kicker {
        margin: 0 0 4px;
        color: var(--muted);
        font-size: 11px;
      }

      .page-title {
        margin: 0;
        color: var(--text);
        font-size: 22px;
        line-height: 1.1;
        letter-spacing: -0.035em;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .icon-button {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.78);
        box-shadow: var(--shadow-sm);
        cursor: pointer;
        transition: transform 160ms ease, background 160ms ease;
      }

      .icon-button:active {
        transform: scale(0.94);
      }

      .icon-button svg,
      .tab-icon svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .placeholder-hero {
        margin-top: 12px;
        padding: 22px;
        overflow: hidden;
        position: relative;
        border-radius: 28px;
        color: white;
        background: linear-gradient(145deg, #1b1d30, #4b4594);
        box-shadow: 0 20px 44px rgba(33, 31, 71, 0.2);
      }

      .placeholder-hero::after {
        content: '';
        width: 128px;
        height: 128px;
        position: absolute;
        right: -42px;
        bottom: -58px;
        border-radius: 42% 58% 55% 45%;
        background: linear-gradient(145deg, #8c82ff, var(--coral));
        transform: rotate(19deg);
        opacity: 0.82;
      }

      .placeholder-hero small {
        color: #bcb8e4;
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.08em;
      }

      .placeholder-hero h2 {
        max-width: 240px;
        margin: 10px 0 8px;
        font-size: 25px;
        line-height: 1.08;
        letter-spacing: -0.04em;
      }

      .placeholder-hero p {
        max-width: 245px;
        margin: 0;
        color: #d3d4dd;
        font-size: 12px;
        line-height: 1.55;
      }

      .placeholder-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 16px;
      }

      .placeholder-card {
        min-height: 104px;
        padding: 16px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: var(--shadow-sm);
      }

      .placeholder-card strong {
        display: block;
        color: var(--text);
        font-size: 14px;
      }

      .placeholder-card span {
        display: block;
        margin-top: 8px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
      }

      .nono {
        --nono-size: 58px;
        width: var(--nono-size);
        height: calc(var(--nono-size) * 0.91);
        position: relative;
        flex: none;
        border-radius: 45% 55% 48% 52% / 50% 46% 54% 50%;
        background: radial-gradient(
          circle at 29% 20%,
          #ffffff 0 8%,
          #eceaff 31%,
          #8a80ed 69%,
          #403a65 100%
        );
        box-shadow: inset -8px -9px 15px rgba(35, 31, 77, 0.3),
          inset 7px 6px 12px rgba(255, 255, 255, 0.68),
          0 12px 24px rgba(65, 57, 143, 0.24);
        animation: nono-breathe 2.4s ease-in-out infinite;
      }

      .nono::before,
      .nono::after {
        content: '';
        width: 7px;
        height: 17px;
        position: absolute;
        top: 42%;
        z-index: -1;
        border-radius: 7px;
        background: #8076df;
      }

      .nono::before {
        left: -3px;
      }

      .nono::after {
        right: -3px;
      }

      .nono-visor {
        width: 66%;
        height: 42%;
        position: absolute;
        left: 50%;
        top: 53%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20%;
        transform: translate(-50%, -50%);
        border-radius: 42% 42% 48% 48%;
        background: linear-gradient(155deg, #292a40, #11121c 68%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1),
          0 5px 12px rgba(23, 21, 47, 0.3);
      }

      .nono-eye {
        width: 8%;
        min-width: 3px;
        height: 40%;
        border-radius: 3px;
        background: var(--mint);
        box-shadow: 0 0 7px #62ddc7, 0 0 13px rgba(98, 221, 199, 0.4);
      }

      .nono-status-light {
        width: 18%;
        height: 2px;
        position: absolute;
        left: 50%;
        bottom: 13%;
        transform: translateX(-50%);
        border-radius: 99px;
        background: var(--mint);
        box-shadow: 0 0 6px var(--mint);
      }

      .nono.is-thinking .nono-eye {
        width: 16%;
        height: 18%;
        animation: nono-scan 1.1s ease-in-out infinite alternate;
      }

      .nono.is-confirm {
        filter: drop-shadow(0 0 11px rgba(255, 155, 121, 0.82));
      }

      .nono.is-confirm .nono-eye,
      .nono.is-confirm .nono-status-light,
      .nono.is-error .nono-eye,
      .nono.is-error .nono-status-light {
        background: var(--coral);
        box-shadow: 0 0 7px var(--coral);
      }

      .nono.is-success .nono-eye {
        width: 15%;
        height: 18%;
        border-bottom: 2px solid var(--mint);
        border-radius: 0 0 6px 6px;
        background: transparent;
      }

      .app-icon {
        --icon-size: 58px;
        width: var(--icon-size);
        height: var(--icon-size);
        position: relative;
        overflow: hidden;
        flex: none;
        border-radius: 30%;
        background: linear-gradient(145deg, #191b2f, #4e47ab 57%, #8e84ff);
        box-shadow: 0 14px 30px rgba(55, 49, 133, 0.26);
      }

      .app-icon::before,
      .app-icon::after {
        content: '';
        position: absolute;
        border-radius: 50%;
      }

      .app-icon::before {
        width: 66%;
        height: 66%;
        right: -22%;
        top: -18%;
        background: #8b81ff;
      }

      .app-icon::after {
        width: 43%;
        height: 43%;
        left: -14%;
        bottom: -10%;
        background: var(--coral);
      }

      .app-icon-glyph {
        width: 36%;
        height: 36%;
        position: absolute;
        left: 32%;
        top: 32%;
        z-index: 1;
        border-radius: 31% 8% 31% 8%;
        background: white;
        transform: rotate(45deg);
        box-shadow: 0 0 17px rgba(255, 255, 255, 0.65);
      }

      .home-intro {
        padding: 10px 2px 0;
      }

      .home-intro h2 {
        margin: 0;
        max-width: 310px;
        color: var(--text);
        font-size: 31px;
        line-height: 1.08;
        letter-spacing: -0.055em;
      }

      .home-intro p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .composer-card {
        margin-top: 22px;
        padding: 18px;
        border: 1px solid rgba(255, 255, 255, 0.95);
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 18px 38px rgba(34, 35, 57, 0.11);
      }

      .task-input {
        width: 100%;
        min-height: 110px;
        resize: none;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        font-size: 16px;
        line-height: 1.55;
      }

      .task-input::placeholder {
        color: #a2a4ad;
      }

      .composer-footer,
      .task-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .text-button,
      .pill-button,
      .primary-button,
      .soft-button,
      .danger-button {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 750;
        transition: transform 160ms ease, opacity 160ms ease,
          background 160ms ease;
      }

      .text-button:active,
      .pill-button:active,
      .primary-button:active,
      .soft-button:active,
      .danger-button:active {
        transform: scale(0.96);
      }

      .text-button {
        min-height: 36px;
        padding: 0 10px;
        color: var(--muted);
        background: transparent;
        font-size: 12px;
      }

      .primary-button {
        padding: 0 18px;
        color: white;
        background: var(--ink);
        box-shadow: 0 11px 20px rgba(27, 29, 48, 0.18);
        font-size: 13px;
      }

      .primary-button[disabled] {
        cursor: not-allowed;
        opacity: 0.38;
        box-shadow: none;
      }

      .soft-button {
        padding: 0 15px;
        color: #5d54cf;
        background: #ebe8ff;
        font-size: 12px;
      }

      .danger-button {
        padding: 0 15px;
        color: var(--danger);
        background: #fff0ec;
        font-size: 12px;
      }

      .section-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        margin: 24px 2px 12px;
      }

      .page-header + .section-heading,
      .setting-row + .section-heading,
      .mode-seg + .section-heading {
        margin-top: 12px;
      }

      .subpage-header + .setting-row,
      .subpage-header + .pipeline-caption,
      .subpage-header + .form-card,
      .subpage-header + .card-list,
      .subpage-header + .inline-note {
        margin-top: 8px;
      }

      .form-stack .mode-seg {
        margin: 0;
      }

      .form-stack .pipeline-caption {
        margin: 4px 0 8px;
      }

      .form-stack .danger-button {
        margin-top: 2px;
      }

      .activity-card {
        transition: transform 160ms ease;
      }

      .activity-card:active {
        transform: scale(0.985);
      }

      #home-orbits:has([data-pos='dock-actions']) [data-pos='dock-bottom'] {
        bottom: 62px;
      }

      .section-heading h3 {
        margin: 0;
        color: var(--text);
        font-size: 16px;
      }

      .section-heading span {
        color: var(--muted);
        font-size: 10px;
      }

      .suggestion-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .suggestion-chip {
        min-height: 38px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #434552;
        background: rgba(255, 255, 255, 0.8);
        box-shadow: 0 6px 15px rgba(34, 35, 54, 0.05);
        cursor: pointer;
        font-size: 11px;
      }

      .quick-task-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 14px;
      }

      .quick-task {
        min-height: 86px;
        padding: 14px;
        overflow: hidden;
        position: relative;
        text-align: left;
        border-radius: 19px;
        color: var(--text);
        cursor: pointer;
      }

      .quick-task:nth-child(1) {
        background: #ddd9ff;
      }

      .quick-task:nth-child(2) {
        background: #ffe0d6;
      }

      .quick-task:nth-child(3) {
        background: #d9efeb;
      }

      .quick-task:nth-child(4) {
        background: #efe4ff;
      }

      .quick-task strong {
        display: block;
        position: relative;
        z-index: 1;
        font-size: 13px;
      }

      .quick-task span {
        display: block;
        margin-top: 7px;
        position: relative;
        z-index: 1;
        color: #676a78;
        font-size: 10px;
      }

      .quick-task::after {
        content: '';
        width: 55px;
        height: 55px;
        position: absolute;
        right: -17px;
        bottom: -22px;
        border-radius: 16px 27px 21px 29px;
        background: linear-gradient(145deg, #8379f0, #5149aa);
        transform: rotate(20deg);
        opacity: 0.74;
      }

      .task-console {
        padding-bottom: 18px;
      }

      .task-main-card {
        margin-top: 10px;
        padding: 19px;
        border-radius: 26px;
        color: white;
        background: radial-gradient(
            circle at 95% 5%,
            #5b53b6 0,
            transparent 35%
          ),
          linear-gradient(145deg, #1b1d30, #292946);
        box-shadow: 0 20px 46px rgba(24, 25, 43, 0.24);
      }

      .task-state-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .task-state-copy small {
        color: #aaa5e9;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      .task-state-copy h2 {
        margin: 7px 0 5px;
        font-size: 20px;
        line-height: 1.15;
      }

      .task-state-copy p {
        margin: 0;
        color: #c4c6d1;
        font-size: 11px;
        line-height: 1.5;
      }

      .progress-track {
        height: 7px;
        margin-top: 18px;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.13);
      }

      .progress-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--violet), var(--mint));
        transition: width 260ms ease;
      }

      .progress-meta {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        color: #aeb0bc;
        font-size: 9px;
      }

      .state-callout {
        margin-top: 13px;
        padding: 14px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.09);
        border: 1px solid rgba(255, 255, 255, 0.09);
      }

      .state-callout.is-attention {
        color: #40231d;
        background: #ffd9cf;
        border-color: #ffe8e2;
      }

      .state-callout strong {
        display: block;
        font-size: 12px;
      }

      .state-callout span {
        display: block;
        margin-top: 5px;
        color: inherit;
        opacity: 0.78;
        font-size: 10px;
        line-height: 1.5;
      }

      .timeline-list {
        display: grid;
        gap: 9px;
      }

      .timeline-item {
        display: grid;
        grid-template-columns: 30px 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 11px 12px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.84);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 8px 20px rgba(32, 33, 53, 0.05);
      }

      .timeline-index {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        color: #777a87;
        background: #efedf7;
        font-size: 10px;
        font-weight: 800;
      }

      .timeline-item.is-complete .timeline-index {
        color: var(--success);
        background: #dcf2ec;
      }

      .timeline-item.is-current .timeline-index {
        color: white;
        background: var(--violet);
      }

      .timeline-copy strong {
        display: block;
        color: var(--text);
        font-size: 12px;
      }

      .timeline-copy span,
      .timeline-state {
        color: var(--muted);
        font-size: 9px;
      }

      .timeline-copy span {
        display: block;
        margin-top: 3px;
      }

      .demo-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
        padding: 12px;
        border: 1px dashed #cfcbe8;
        border-radius: 18px;
        background: rgba(245, 243, 253, 0.78);
      }

      .demo-controls::before {
        content: '原型演示控制';
        width: 100%;
        color: #77718e;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.07em;
      }

      .card-actions {

      .card-actions.is-split {

      .card-action-main {

      .capability-open strong {
        display: block;
        color: var(--text);
        font-size: 13px;
      }

      .capability-open span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.45;
      }

      .capability-open small {
        display: block;
        margin-top: 8px;
        color: #9a9ca7;
        font-size: 10px;
        font-weight: 700;
      }

        color: #5d55cb;

        font-weight: 800;
      }

      }

      .toggle {

        cursor: pointer;

      .toggle::after {
        content: '';

        height: 21px;
        display: block;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 2px 5px rgba(24, 25, 38, 0.18);

      }

      .toggle[aria-pressed='true'] {
        background: var(--violet);
      }

      .toggle[aria-pressed='true']::after {
        transform: translateX(18px);
      }

      .link-row {
        width: 100%;
        min-height: 62px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 15px;
        border-radius: 19px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.84);
        box-shadow: var(--shadow-sm);
        cursor: pointer;
        font-size: 12px;
        font-weight: 750;
      }

      .link-row span {
        color: #9a9ca7;
      }

      .model-guide-link {
        margin-top: 18px;
      }

      .log-item {
        padding: 12px;
        border-left: 3px solid var(--violet);
        border-radius: 5px 14px 14px 5px;
        color: #525461;
        background: #fff;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 9px;
        line-height: 1.55;
      }

      .about-mark {
        display: grid;
        place-items: center;
        gap: 10px;
        margin: 20px 0;
        text-align: center;
      }

      .about-mark h2,
      .about-mark p {
        margin: 0;
      }

      .about-mark p {
        color: var(--muted);
        font-size: 10px;
      }

      .overlay-widget {
        width: 66px;
        height: 66px;
        position: absolute;
        z-index: 2;
        pointer-events: auto;
        touch-action: none;
        transition: left 200ms ease, transform 220ms ease;
      }

      .overlay-widget.is-peeking[data-side='left'] {
        transform: translateX(-40%);
      }

      .overlay-widget.is-peeking[data-side='right'] {
        transform: translateX(40%);
      }

      .overlay-bubble {
        width: 66px;
        height: 66px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 2px solid rgba(255, 255, 255, 0.92);
        border-radius: 24px;
        background: rgba(27, 29, 48, 0.94);
        box-shadow: 0 15px 32px rgba(25, 26, 46, 0.32);
        cursor: grab;
      }

      .overlay-bubble:active {
        cursor: grabbing;
      }

      .overlay-widget.is-attention .overlay-bubble {
        background: #5c3027;
        box-shadow: 0 15px 32px rgba(171, 75, 53, 0.32);
      }

      .overlay-card {
        width: 250px;
        position: absolute;
        top: 72px;
        padding: 15px;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 21px;
        color: white;
        background: rgba(27, 29, 48, 0.97);
        box-shadow: 0 20px 45px rgba(21, 22, 38, 0.35);
        backdrop-filter: blur(13px);
      }

      .overlay-widget[data-side='right'] .overlay-card {
        right: 0;
      }

      .overlay-widget[data-side='left'] .overlay-card {
        left: 0;
      }

      .overlay-card strong {
        display: block;
        font-size: 12px;
      }

      .overlay-card p {
        margin: 6px 0 12px;
        color: #bec0cb;
        font-size: 10px;
        line-height: 1.45;
      }

      .overlay-progress,
      .notification-progress {
        height: 5px;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.13);
      }

      .overlay-progress span,
      .notification-progress span {
        height: 100%;
        display: block;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--violet), var(--mint));
      }

      .overlay-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
        margin-top: 12px;
      }

      .overlay-actions button {
        min-height: 36px;
        border-radius: 11px;
        color: white;
        background: rgba(255, 255, 255, 0.1);
        cursor: pointer;
        font-size: 9px;
        font-weight: 750;
      }

      .overlay-actions .is-danger {
        color: #ffd4c8;
        background: rgba(255, 155, 121, 0.18);
      }

      .notification-peek {
        position: absolute;
        top: 8px;
        right: 15px;
        padding: 7px 10px;
        pointer-events: auto;
        border-radius: 999px;
        color: white;
        background: rgba(27, 29, 48, 0.9);
        box-shadow: 0 7px 18px rgba(25, 26, 43, 0.2);
        cursor: pointer;
        font-size: 8px;
        font-weight: 800;
      }

      .notification-shade {
        position: absolute;
        inset: 0;
        padding: 46px 12px 0;
        pointer-events: auto;
        background: linear-gradient(
          180deg,
          rgba(34, 35, 53, 0.68),
          rgba(34, 35, 53, 0.16) 42%,
          transparent 68%
        );
        backdrop-filter: blur(4px);
      }

      .notification-card {
        padding: 15px;
        border: 1px solid rgba(255, 255, 255, 0.88);
        border-radius: 22px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 17px 40px rgba(27, 29, 48, 0.22);
      }

      .notification-title {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .notification-title strong {
        display: block;
        font-size: 12px;
      }

      .notification-title span {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 9px;
      }

      .notification-card p {
        margin: 11px 0;
        color: #5f616e;
        font-size: 10px;
        line-height: 1.45;
      }

      .notification-card .overlay-actions button {
        color: #5149ad;
        background: #eeecff;
      }

      .notification-card .overlay-actions .is-danger {
        color: var(--danger);
        background: #fff0ec;
      }

      .modal-backdrop {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: flex-end;
        padding: 14px;
        pointer-events: auto;
        background: rgba(19, 20, 34, 0.42);
        backdrop-filter: blur(5px);
      }

      .modal-sheet {
        width: 100%;
        padding: 20px;
        border-radius: 26px;
        color: white;
        background: var(--ink);
        box-shadow: 0 22px 52px rgba(18, 19, 33, 0.36);
      }

      .modal-grab {
        width: 38px;
        height: 4px;
        margin: 0 auto 16px;
        border-radius: 99px;
        background: #555869;
      }

      .modal-sheet h2 {
        margin: 0;
        font-size: 18px;
      }

      .modal-sheet p {
        margin: 8px 0 18px;
        color: #c4c6d0;
        font-size: 12px;
        line-height: 1.55;
      }

      .modal-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }

      .modal-actions button {
        min-height: 44px;
        border-radius: 14px;
        cursor: pointer;
        font-weight: 750;
      }

      .modal-cancel {
        color: white;
        background: rgba(255, 255, 255, 0.1);
      }

      .modal-confirm {
        color: #4c271f;
        background: var(--coral);
      }

      .toast {
        max-width: calc(100% - 28px);
        position: absolute;
        left: 50%;
        top: 54px;
        transform: translateX(-50%);
        padding: 11px 14px;
        pointer-events: auto;
        border-radius: 14px;
        color: white;
        background: rgba(27, 29, 48, 0.94);
        box-shadow: 0 12px 26px rgba(21, 22, 38, 0.23);
        font-size: 11px;
        line-height: 1.4;
      }

      #tab-bar {
        --active-tab-index: 0;
        height: 76px;
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 20;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        align-items: center;
        padding: 7px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 24px;
        background: rgba(27, 29, 48, 0.95);
        box-shadow: 0 16px 32px rgba(20, 21, 36, 0.22);
        backdrop-filter: blur(18px);
        isolation: isolate;
      }

      .tab-indicator {
        width: calc((100% - 14px) / 4);
        position: absolute;
        left: 7px;
        top: 7px;
        bottom: 7px;
        z-index: 0;
        pointer-events: none;
        border-radius: 18px;
        background: linear-gradient(145deg, #8178f5, var(--violet));
        box-shadow: 0 9px 20px rgba(82, 72, 199, 0.34);
        transform: translateX(calc(var(--active-tab-index) * 100%));
        transition: transform var(--motion-tab) var(--motion-ease);
      }

      .tab-button {
        min-width: 0;
        height: 62px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        position: relative;
        z-index: 1;
        border-radius: 18px;
        color: #858896;
        background: transparent;
        cursor: pointer;
        transition: color 200ms ease, transform 160ms ease;
      }

      .tab-button:active {
        transform: scale(0.94);
      }

      .tab-button[aria-current='page'] {
        color: white;
        background: transparent;
      }

      .tab-icon {
        display: grid;
        transition: transform var(--motion-tab) var(--motion-ease);
      }

      .tab-button[aria-current='page'] .tab-icon {
        transform: translateY(-2px) scale(1.08);
      }

      .tab-label {
        font-size: 10px;
        font-weight: 700;
      }

      #overlay-layer,
      #notification-layer,
      #modal-root,
      #toast-root {
        position: absolute;
        inset: 0;
        z-index: 30;
        pointer-events: none;
      }

      #notification-layer {
        z-index: 35;
      }

      #modal-root {
        z-index: 50;
      }

      #toast-root {
        z-index: 60;
      }

      @keyframes layer-tab-in-forward {
        from {
          opacity: 0.55;
          transform: translate3d(28%, 0, 0) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes layer-tab-out-forward {
        from {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
        to {
          opacity: 0.48;
          transform: translate3d(-12%, 0, 0) scale(0.985);
        }
      }

      @keyframes layer-tab-in-back {
        from {
          opacity: 0.55;
          transform: translate3d(-28%, 0, 0) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes layer-tab-out-back {
        from {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
        to {
          opacity: 0.48;
          transform: translate3d(12%, 0, 0) scale(0.985);
        }
      }

      @keyframes layer-stack-in-forward {
        from {
          transform: translate3d(100%, 0, 0);
        }
        to {
          transform: translate3d(0, 0, 0);
        }
      }

      @keyframes layer-stack-out-forward {
        from {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
        to {
          opacity: 0.72;
          transform: translate3d(-8%, 0, 0) scale(0.97);
        }
      }

      @keyframes layer-stack-in-back {
        from {
          opacity: 0.72;
          transform: translate3d(-8%, 0, 0) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes layer-stack-out-back {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(100%, 0, 0);
        }
      }

      @keyframes nono-breathe {
        50% {
          transform: translateY(-3px) rotate(1deg);
        }
      }

      @keyframes nono-scan {
        to {
          transform: translateX(3px);
        }
      }

      #avatar-host {
        position: absolute;
        z-index: 8;
        pointer-events: none;
        transition: top var(--motion-stack) var(--motion-ease),
          right var(--motion-stack) var(--motion-ease),
          left var(--motion-stack) var(--motion-ease),
          width var(--motion-stack) var(--motion-ease),
          height var(--motion-stack) var(--motion-ease),
          opacity 220ms ease;
      }

      #avatar-host[data-layout='stage'] {
        top: 0;
        left: 0;
        width: 100%;
        height: calc(100% - 92px);
        opacity: 1;
      }

      #avatar-host[data-layout='hidden'] {
        top: 0;
        left: 0;
        width: 100%;
        height: calc(100% - 92px);
        opacity: 0;
        visibility: hidden;
      }

      #avatar-canvas {

      const DEMO_STEPS = [
        '打开目标应用',
        '搜索并筛选内容',
        '读取详情并比较',
        '等待你的确认',
        '完成最后操作',
      ];

      let toastTimer = 0;
      let overlayPeekTimer = 0;
      let overlayDrag = null;
      let modalReturnFocus = null;
      let activeLayerTransition = null;
      let localVisionTimer = 0;
      let lookDownloadTimer = 0;
      let listenTimer = 0;

      function escapeHtml(value) {
        return String(value ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      function showToast(message, tone = 'info') {
        appState.toast = {message, tone};
        clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => {
          appState.toast = null;
          renderToast();
        }, 2600);
        renderToast();
      }

      function createDemoTask(instruction) {
        const cleanInstruction = String(instruction || '').trim();
        if (!cleanInstruction) {
          showToast('请先告诉 NoNo 你想完成什么', 'warning');
          return null;
        }
        if (!isOperateReady()) {
          redirectForOperateSetup();
          return null;
        }
        appState.avatarListening = false;
        appState.heardText = '';
        appState.heardTurn = null;
        appState.task = {
          id: `demo-${Date.now()}`,
          instruction: cleanInstruction,
          status: 'running',
          stepIndex: 0,
          steps: [...DEMO_STEPS],
          startedAt: Date.now(),
          result: null,
          error: null,
        };
        appState.taskInput = cleanInstruction;
        appState.overlay.visible = true;
        renderApp();
        return appState.task;
      }

      function advanceTask() {
        const task = appState.task;
        if (!task || task.status !== 'running') return;
        if (task.stepIndex === 2) {
          task.status = 'needs_confirmation';
        } else if (task.stepIndex >= task.steps.length - 1) {
          finishTask('succeeded');
          return;
        } else {
          task.stepIndex += 1;
        }
        renderApp();
      }

      function resolveConfirmation(approved) {
        const task = appState.task;
        if (!task || task.status !== 'needs_confirmation') return;
        if (!approved) {
          finishTask('cancelled');
          return;
        }
        task.stepIndex = 3;
        task.status = 'running';
        showToast('已确认，NoNo 将继续执行', 'success');
        renderApp();
      }

      function finishTask(kind) {
        const task = appState.task;
        if (!task) return;
        const terminalKinds = ['succeeded', 'failed', 'cancelled'];
        if (!terminalKinds.includes(kind)) return;
        task.status = kind;
        task.finishedAt = Date.now();
        task.result = kind === 'succeeded' ? '演示任务已安全完成' : null;
        task.error =
          kind === 'failed' ? '模型服务暂时不可用，请稍后重试' : null;
        appState.overlay.visible = false;
        const exists = appState.activities.some(item => item.id === task.id);
        if (!exists && appState.settings.autoHistory !== false) {
          appState.activities.unshift({
            id: task.id,
            instruction: task.instruction,
            status: kind,
            stepCount: task.stepIndex + 1,
            createdAt: new Date(task.startedAt).toISOString(),
            summary:
              kind === 'succeeded'
                ? '任务完成，演示结果已生成'
                : kind === 'failed'
                ? '任务未完成，可检查模型设置后重试'
                : '任务已由用户终止',
          });
        }
        showToast(
          kind === 'succeeded'
            ? 'NoNo 已完成任务'
            : kind === 'failed'
            ? '任务执行失败，输入已保留'
            : '任务已安全终止',
          kind === 'succeeded' ? 'success' : 'warning',
        );
        renderApp();
      }

      function requestTaskStop(source = 'app') {
        if (!appState.task) return;
        appState.modal = {
          type: 'stop-task',
          source,
          title: '确定终止当前任务？',
          message:
            'NoNo 会停止后续操作；已经在其他应用中完成的操作无法自动撤销。',
        };
        renderModal();
      }

      function getTaskProgress() {
        const task = appState.task;
        if (!task) return 0;
        return Math.min(
          100,
          Math.round(((task.stepIndex + 0.5) / task.steps.length) * 100),
        );
      }

      function renderOverlay() {
        const root = document.getElementById('overlay-layer');
        const task = appState.task;
        const active =
          task &&
          !['succeeded', 'failed', 'cancelled'].includes(task.status) &&
          appState.overlay.visible &&
          appState.permissions.overlay;
        if (!active) {
          root.innerHTML = '';
          clearTimeout(overlayPeekTimer);
          return;
        }
        const shell = document.getElementById('phone-shell');
        const maxX = Math.max(12, shell.clientWidth - 78);
        const maxY = Math.max(80, shell.clientHeight - 162);
        const x = Math.min(maxX, Math.max(12, appState.overlay.x ?? maxX));
        const y = Math.min(maxY, Math.max(62, appState.overlay.y));
        appState.overlay.x = x;
        appState.overlay.y = y;
        appState.overlay.side = x < maxX / 2 ? 'left' : 'right';
        const progress = getTaskProgress();
        const currentStep = task.steps[task.stepIndex] || '正在准备';
        root.innerHTML = `
          <aside class="overlay-widget ${
            appState.overlay.peek ? 'is-peeking' : ''
          } ${
          task.status === 'needs_confirmation' ||
          task.status === 'manual_takeover'
            ? 'is-attention'
            : ''
        }" data-overlay-widget data-side="${
          appState.overlay.side
        }" style="left:${x}px;top:${y}px">
            <button class="overlay-bubble" type="button" data-action="toggle-overlay" data-overlay-bubble aria-label="${
              appState.overlay.expanded ? '收起' : '展开'
            } NoNo 悬浮球">${renderNoNo(task.status, 43)}</button>
            ${
              appState.overlay.expanded
                ? `<section class="overlay-card"><strong>${
                    task.status === 'needs_confirmation'
                      ? '需要你的确认'
                      : task.status === 'manual_takeover'
                      ? '等待手动接管'
                      : 'NoNo 正在执行'
                  }</strong><p>${escapeHtml(currentStep)} · 步骤 ${
                    task.stepIndex + 1
                  }/${
                    task.steps.length
                  }</p><div class="overlay-progress"><span style="width:${progress}%"></span></div><div class="overlay-actions"><button type="button" data-action="surface-open-task" data-source="overlay">返回任务</button><button class="is-danger" type="button" data-action="surface-request-stop" data-source="overlay">终止</button></div></section>`
                : ''
            }
          </aside>`;
        scheduleOverlayPeek();
      }

      function renderNotification() {
        const root = document.getElementById('notification-layer');
        const task = appState.task;
        const active =
          task &&
          !['succeeded', 'failed', 'cancelled'].includes(task.status) &&
          appState.permissions.notification;
        if (!active) {
          root.innerHTML = '';
          return;
        }
        const currentStep = task.steps[task.stepIndex] || '正在准备';
        const title =
          task.status === 'needs_confirmation'

        root.innerHTML = appState.notificationTrayOpen
          ? `<div class="notification-shade" data-action="toggle-notification-tray"><article class="notification-card"><div class="notification-title">${renderAppIcon(

              task.stepIndex + 1
            }/${task.steps.length}</span></span></div><p>${escapeHtml(

            )}</p><div class="notification-progress"><span style="width:${getTaskProgress()}%"></span></div><div class="overlay-actions"><button type="button" data-action="surface-open-task" data-source="notification">查看任务</button><button class="is-danger" type="button" data-action="surface-request-stop" data-source="notification">终止</button></div></article></div>`
          : '<button class="notification-peek" type="button" data-action="toggle-notification-tray">NoNo · 任务运行中</button>';
      }

      function beginOverlayDrag(event) {
        const bubble = event.target.closest('[data-overlay-bubble]');
        if (!bubble) return;
        const widget = bubble.closest('[data-overlay-widget]');
        appState.overlay.peek = false;
        clearTimeout(overlayPeekTimer);
        overlayDrag = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          originX: appState.overlay.x,
          originY: appState.overlay.y,
          moved: false,
          widget,
        };
        try {
          bubble.setPointerCapture(event.pointerId);
        } catch {
          /* Browser harnesses may not implement pointer capture. */
        }
      }

      function moveOverlay(event) {
        if (!overlayDrag || event.pointerId !== overlayDrag.pointerId) return;
        const deltaX = event.clientX - overlayDrag.startX;
        const deltaY = event.clientY - overlayDrag.startY;
        overlayDrag.moved ||= Math.hypot(deltaX, deltaY) >= 5;
        if (!overlayDrag.moved) return;
        const shell = document.getElementById('phone-shell');
        appState.overlay.x = Math.min(
          shell.clientWidth - 78,
          Math.max(12, overlayDrag.originX + deltaX),
        );
        appState.overlay.y = Math.min(
          shell.clientHeight - 162,
          Math.max(62, overlayDrag.originY + deltaY),
        );
        overlayDrag.widget.style.left = `${appState.overlay.x}px`;
        overlayDrag.widget.style.top = `${appState.overlay.y}px`;
      }

      function endOverlayDrag(event) {
        if (!overlayDrag || event.pointerId !== overlayDrag.pointerId) return;
        const moved = overlayDrag.moved;
        overlayDrag = null;
        if (moved) {
          appState.overlay.ignoreClickUntil = performance.now() + 250;
          snapOverlayToEdge();
        } else {
          scheduleOverlayPeek();
        }
      }

      function snapOverlayToEdge() {
        const shell = document.getElementById('phone-shell');
        const maxX = Math.max(12, shell.clientWidth - 78);
        appState.overlay.side =
          appState.overlay.x < maxX / 2 ? 'left' : 'right';
        appState.overlay.x = appState.overlay.side === 'left' ? 12 : maxX;
        renderOverlay();
      }

      function scheduleOverlayPeek() {
        clearTimeout(overlayPeekTimer);
        if (
          appState.overlay.expanded ||
          appState.overlay.peek ||
          !appState.overlay.visible
        )
          return;
        overlayPeekTimer = window.setTimeout(() => {
          appState.overlay.peek = true;
          renderOverlay();
        }, 3000);
      }

      function collapseOverlay() {
        if (!appState.overlay.expanded) return;
        appState.overlay.expanded = false;
        renderOverlay();
      }

      function openTaskFromSurface(source) {
        appState.notificationTrayOpen = false;
        appState.overlay.expanded = false;
        appState.route = 'home';
        appState.stack = [];
        showToast(
          source === 'notification' ? '已从通知返回任务' : '已从悬浮球返回任务',
          'info',
        );
        renderApp();
      }

      function isTaskBusy() {
        return Boolean(
          appState.task &&
            !['succeeded', 'failed', 'cancelled'].includes(appState.task.status),
        );
      }

      function isAgentRunnable() {
        const mode = appState.agent.activeMode;
        const lists = appState.agent.lists;
        if (mode === 'cloud_direct') return Boolean(lists.unified.activeId);
        if (mode === 'cloud_split')
          return Boolean(lists.splitVision.activeId && lists.splitPlanner.activeId);
        return (
          appState.agent.eligibility === 'ready' &&
          Boolean(lists.localPlanner.activeId)
        );
      }

      function isCompanionReady() {
        return Boolean(appState.companion.activeId);
      }

      function isOperateReady() {
        if (appState.capabilities.openclaw) return true;
        return appState.capabilities.phoneOperate && isAgentRunnable();
      }

      function activeCompanion() {
        return appState.companion.items.find(
          item => item.id === appState.companion.activeId,
        );
      }

      function companionLabel() {
        return activeCompanion()?.name || '未配置陪伴模型';
      }

      function activeLook() {
        return (
          appState.looks.items.find(item => item.id === appState.looks.activeId) ||
          appState.looks.items[0]
        );
      }

      function lookStatus(item) {
        if (item.id === appState.looks.activeId) return ['使用中', 'is-success'];
        if (appState.looks.downloadingId === item.id) return ['下载中', ''];
        if (item.installed) return ['已下载', 'is-success'];
        return ['未下载', 'is-muted'];
      }

      function startLookDownload(id) {
        const item = appState.looks.items.find(look => look.id === id);
        if (!item || item.installed) return;
        appState.looks.downloadingId = id;
        appState.looks.downloadProgress = 8;
        renderApp();
        window.clearInterval(lookDownloadTimer);
        lookDownloadTimer = window.setInterval(() => {
          appState.looks.downloadProgress = Math.min(
            100,
            appState.looks.downloadProgress + 14,
          );
          if (appState.looks.downloadProgress >= 100) {
            window.clearInterval(lookDownloadTimer);
            item.installed = true;
            appState.looks.downloadingId = null;
            appState.looks.activeId = id;
            showToast(`已换成「${item.title}」`, 'success');
            if (appState.route === 'avatar-looks') renderApp();
            return;
          }
          const fill = document.querySelector(
            `[data-look-id="${id}"] .download-track span`,
          );
          if (fill) fill.style.width = `${appState.looks.downloadProgress}%`;
          else if (appState.route === 'avatar-looks') renderApp();
        }, 140);
      }

      function redirectForCompanionSetup() {
        showToast('请先在设置里配置陪伴对话模型', 'warning');
        openSettingsPage('companion-config');
      }

      function redirectForOperateSetup() {
        if (!appState.capabilities.phoneOperate && !appState.capabilities.openclaw) {
          showToast('要操作手机，请先打开「替我操作手机」或 OpenClaw', 'warning');
          navigate('capabilities');
          return;
        }
        showToast('请先为「替我操作手机」启用可用模式', 'warning');
        openCapabilityPage('models');
      }

      function memoryLocationLabel() {
        return appState.privacy.memoryLocation === 'openclaw'
          ? '随 OpenClaw 在网关'
          : '仅这台手机';
      }

      function memoryKindLabel(kind) {
        return {name: '称呼', preference: '偏好', errand: '交代'}[kind] || kind;
      }

      function errandTypeLabel(type) {
        return type === 'schedule' ? '定时' : '单次';
      }

      function errandSummary(item) {
        if (item.errandType === 'schedule') {
          return `${item.when || '未设时间'} · 到点再办，办完仍留在这里`;
        }
        return '还没办 · 办完会进「做过的事」';
      }

      function companionRecall() {
        const parts = [];
        if (appState.privacy.memoryEnabled) {
          const pref = appState.memories.find(item => item.kind === 'preference');
          if (pref) parts.push(pref.title);
        }
        if (appState.capabilities.errands) {
          const errand =
            appState.memories.find(
              item => item.kind === 'errand' && item.errandType === 'schedule',
            ) || appState.memories.find(item => item.kind === 'errand');
          if (errand) parts.push(errand.title);
        }
        return parts.slice(0, 2).join(' · ');
      }

      function citePreference() {
        if (!appState.privacy.memoryEnabled) return null;
        return (
          appState.memories.find(
            item => item.kind === 'preference' && item.title.includes('咖啡'),
          ) || appState.memories.find(item => item.kind === 'preference')
        );
      }

      const DEMO_TURNS = [
        {
          text: '帮我查找附近评分高的咖啡店',
          intent: 'operate',
          citePref: true,
        },
        {
          text: '以后点奶茶也少糖',
          intent: 'preference',
          proposal: {
            kind: 'preference',
            title: '奶茶少糖',
            body: '点奶茶时默认少糖',
          },
        },
        {
          text: '每周五下班前提醒我交周报',
          intent: 'errand',
          proposal: {
            kind: 'errand',
            errandType: 'schedule',
            title: '每周五下班前提醒交周报',
            when: '周五 18:00',
          },
        },
      ];

      function getModelList(listKey) {
        if (listKey === 'companion') return appState.companion;
        return appState.agent.lists[listKey] || appState.agent.lists.unified;
      }

      function ensureModeModelsSelected(mode) {
        const pick = key => {
          const store = appState.agent.lists[key];
          if (!store?.items?.length) return;
          if (!store.items.some(item => item.id === store.activeId)) {
            store.activeId = store.items[0].id;
          }
        };
        if (mode === 'cloud_direct') pick('unified');
        if (mode === 'cloud_split') {
          pick('splitVision');
          pick('splitPlanner');
        }
        if (mode === 'local_vision_cloud_planner') pick('localPlanner');
      }

      function avatarMoodFromTask(status) {
        return (
          {
            preparing: 'thinking',
            running: 'thinking',
            needs_confirmation: 'confirm',
            manual_takeover: 'confirm',
            succeeded: 'success',
            failed: 'error',
            cancelled: 'error',
          }[status] || 'idle'
        );
      }

      function syncAvatar() {
        const host = document.getElementById('avatar-host');
        if (!host) return;
        const onHome = appState.route === 'home' && appState.stack.length === 0;
        let layout = 'hidden';
        let mood = 'idle';
        if (onHome) {
          layout = 'stage';
          mood = appState.avatarListening
            ? 'listen'
            : appState.task
            ? avatarMoodFromTask(appState.task.status)
            : 'idle';
        }
        host.dataset.layout = layout;
        host.dataset.mood = mood;
        window.NonoAvatar?.setLayout(layout);
        window.NonoAvatar?.setMood(mood);
      }

      function startVoiceListen() {
        if (isTaskBusy() || appState.avatarListening) return;
        if (!isCompanionReady()) {
          redirectForCompanionSetup();
          return;
        }
        appState.avatarListening = true;
        appState.heardText = '';
        appState.heardTurn = null;
        window.clearTimeout(listenTimer);
        renderApp();
        listenTimer = window.setTimeout(() => {
          const turn = DEMO_TURNS[appState.listenTurn % DEMO_TURNS.length];
          appState.listenTurn += 1;
          endVoiceListen(turn);
        }, 2600);
      }

      function endVoiceListen(turn) {
        appState.avatarListening = false;
        appState.heardTurn = turn;
        appState.heardText = turn.text;
        window.clearTimeout(listenTimer);
        renderApp();
      }

      function clearHeard() {
        appState.heardText = '';
        appState.heardTurn = null;
      }

      function acceptHeardMemory() {
        const turn = appState.heardTurn;
        const proposal = turn?.proposal;
        if (!proposal) return;
        if (proposal.kind === 'preference') {
          if (!appState.privacy.memoryEnabled) {
            showToast('先在隐私里打开记忆', 'warning');
            return;
          }
          const exists = appState.memories.some(
            item => item.kind === 'preference' && item.title === proposal.title,
          );
          if (!exists) {
            appState.memories.unshift({
              id: `mem-${Date.now()}`,
              kind: 'preference',
              title: proposal.title,
              body: proposal.body || '从对话里确认过的偏好',
            });
          }
          showToast(
            exists ? '这条已经记住了' : '已记住，在活动 · 它还记得',
            exists ? 'info' : 'success',
          );
        } else if (proposal.kind === 'errand') {
          if (!appState.capabilities.errands) {
            showToast('先在能力里打开「交代的事」', 'warning');
            navigate('capabilities');
            return;
          }
          const exists = appState.memories.some(
            item => item.kind === 'errand' && item.title === proposal.title,
          );
          if (!exists) {
            appState.memories.unshift({
              id: `mem-${Date.now()}`,
              kind: 'errand',
              errandType: proposal.errandType || 'once',
              title: proposal.title,
              when: proposal.when || '',
            });
          }
          showToast(
            exists ? '这件交代已经有了' : '已记成交代，可在活动里改',
            exists ? 'info' : 'success',
          );
        }
        clearHeard();
        renderApp();
      }

      function saveHeardAsErrand() {
        const text = appState.heardTurn?.text || appState.heardText;
        if (!text) return;
        if (!appState.capabilities.errands) {
          showToast('先在能力里打开「交代的事」', 'warning');
          navigate('capabilities');
          return;
        }
        appState.memories.unshift({
          id: `mem-${Date.now()}`,
          kind: 'errand',
          errandType: 'once',
          title: text,
          when: '',
        });
        clearHeard();
        showToast('已记成单次交代', 'success');
        renderApp();
      }

      function modeLabel(mode) {
        return (
          {
            cloud_direct: '云端一体',
            cloud_split: '双云端',
            local_vision_cloud_planner: '本地视觉',
          }[mode] || mode
        );
      }

      function renderHomeOrbits() {
        const root = document.getElementById('home-orbits');
        if (!root) return;
        const onHome = appState.route === 'home' && appState.stack.length === 0;
        if (!onHome) {
          root.innerHTML = '';
          return;
        }
        const bubbles = [];
        const modeTip = `<div class="speech-bubble" data-pos="dock-top">陪伴 · ${escapeHtml(
          companionLabel(),
        )}</div>`;
        if (appState.avatarListening) {
          bubbles.push(
            modeTip,
            `<div class="speech-bubble is-mint" data-pos="dock-bottom"><small>正在听</small>说完我会自己停，不用点结束</div>`,
          );
        } else if (appState.task) {
          const task = appState.task;
          const step = task.steps[task.stepIndex] || '正在准备';
          bubbles.push(
            `<div class="speech-bubble" data-pos="dock-top">${escapeHtml(
              step,
            )}</div>`,
          );
          if (task.status === 'needs_confirmation') {
            bubbles.push(
              `<div class="speech-bubble" data-pos="dock-actions"><button class="is-mint" type="button" data-action="confirm-task">确认执行</button><button type="button" data-action="reject-task">先不要</button></div>`,
            );
          } else if (task.status === 'manual_takeover') {
            bubbles.push(
              `<div class="speech-bubble is-mint" data-pos="dock-bottom" data-action="complete-takeover" role="button">交还给 NoNo</div>`,
            );
          } else if (
            ['succeeded', 'failed', 'cancelled'].includes(task.status)
          ) {
            bubbles.push(
              `<button class="speech-bubble is-mint is-action" data-pos="dock-bottom" type="button" data-action="new-task">好的，再来一次</button>`,
            );
          } else {
            bubbles.push(
              `<div class="speech-bubble" data-pos="dock-actions"><button type="button" data-action="advance-task">下一步</button><button type="button" data-action="request-stop-task">终止</button></div>`,
            );
          }
        } else if (appState.heardTurn) {
          const turn = appState.heardTurn;
          const pref = turn.citePref ? citePreference() : null;
          const cite = pref ? `我记得你${pref.title}` : '我听到了';
          let message = turn.text;
          let actions = '';
          if (turn.intent === 'operate') {
            message = pref
              ? `按你「${pref.title}」的习惯，帮你找附近评分高的店`
              : '帮你找附近评分高的咖啡店';
            const buttons = [];
            if (isOperateReady()) {
              buttons.push(
                '<button class="is-mint" type="button" data-action="confirm-heard">开始操作</button>',
              );
            }
            if (appState.capabilities.errands) {
              buttons.push(
                '<button type="button" data-action="save-heard-errand">记成交代</button>',
              );
            }
            if (!buttons.length) {
              buttons.push(
                '<button type="button" data-action="dismiss-heard">好的</button>',
              );
            } else {
              buttons.push(
                '<button type="button" data-action="dismiss-heard">先不用</button>',
              );
            }
            actions = `<div class="speech-bubble" data-pos="dock-actions">${buttons.join(
              '',
            )}</div>`;
          } else if (turn.intent === 'preference') {
            message = turn.proposal.title;
            actions = `<div class="speech-bubble" data-pos="dock-actions"><button class="is-mint" type="button" data-action="accept-heard-memory">记住这条</button><button type="button" data-action="dismiss-heard">不用</button></div>`;
          } else if (turn.intent === 'errand') {
            message = `${turn.proposal.title} · ${turn.proposal.when}`;
            actions = `<div class="speech-bubble" data-pos="dock-actions"><button class="is-mint" type="button" data-action="accept-heard-memory">记成交代</button><button type="button" data-action="dismiss-heard">不用</button></div>`;
          }
          bubbles.push(
            modeTip,
            `<div class="speech-bubble is-mint" data-pos="dock-bottom"><small>${escapeHtml(
              turn.intent === 'preference'
                ? '要不要记住'
                : turn.intent === 'errand'
                ? '要不要交代'

      function updateTabBar() {

        const activeIndex = Math.max(0, TAB_ROUTES.indexOf(activeTab));

        tabBar.querySelectorAll('.tab-button').forEach(button => {

      function sanitizeOutgoingLayer(layer) {
        layer.className = 'screen-layer is-outgoing';
        layer.removeAttribute('data-screen-layer');
        layer.setAttribute('aria-hidden', 'true');
        layer.inert = true;
        layer
          .querySelectorAll('[id]')
          .forEach(element => element.removeAttribute('id'));
        layer
          .querySelectorAll(
            '[for], [aria-labelledby], [aria-describedby], [aria-controls]',
          )
          .forEach(element => {
            element.removeAttribute('for');
            element.removeAttribute('aria-labelledby');
            element.removeAttribute('aria-describedby');
            element.removeAttribute('aria-controls');
          });
        layer
          .querySelectorAll('a, button, input, select, textarea, [tabindex]')
          .forEach(element => element.setAttribute('tabindex', '-1'));
      }

      function finishLayerTransition(transition = activeLayerTransition) {
        if (!transition || transition !== activeLayerTransition) return;
        window.clearTimeout(transition.timer);
        transition.incoming.removeEventListener(
          'animationend',
          transition.finish,
        );
        transition.incoming.removeEventListener(
          'animationcancel',
          transition.finish,
        );
        transition.outgoing.remove();
        transition.incoming.classList.remove('is-incoming');
        transition.root.classList.remove(
          'is-layer-transitioning',
          'motion-tab-forward',
          'motion-tab-back',
          'motion-forward',
          'motion-back',
        );
        activeLayerTransition = null;
      }

      function runLayerTransition(mutator, direction = 'forward') {
        finishLayerTransition();
        const root = document.getElementById('screen-root');
        const current = root.querySelector('[data-screen-layer="current"]');
        const reduceMotion = window.matchMedia?.(
          '(prefers-reduced-motion: reduce)',
        ).matches;

        if (reduceMotion) {
          mutator();
          renderApp();
          return;
        }

        const outgoing = current.cloneNode(true);
        const previousScroll =
          current.querySelector('.page-scroll')?.scrollTop ||
          current.querySelector('.app-screen')?.scrollTop ||
          0;
        sanitizeOutgoingLayer(outgoing);
        root.append(outgoing);
        const outgoingScroller =
          outgoing.querySelector('.page-scroll') ||
          outgoing.querySelector('.app-screen');
        if (outgoingScroller) outgoingScroller.scrollTop = previousScroll;

        mutator();
        renderApp();
        current.classList.add('is-incoming');
        root.classList.add('is-layer-transitioning');
        void root.offsetWidth;
        root.classList.add(`motion-${direction}`);

        const transition = {
          root,
          incoming: current,
          outgoing,
          timer: 0,
          finish: null,
        };
        transition.finish = event => {
          if (event && event.target !== current) return;
          finishLayerTransition(transition);
        };
        current.addEventListener('animationend', transition.finish);
        current.addEventListener('animationcancel', transition.finish);
        transition.timer = window.setTimeout(
          transition.finish,
          direction.startsWith('tab-') ? 380 : 420,
        );
        activeLayerTransition = transition;
      }

      function navigate(route) {
        if (appState.route === route && appState.stack.length === 0) return;
        const currentIndex = TAB_ROUTES.indexOf(getActiveTab());
        const nextIndex = TAB_ROUTES.indexOf(tabFromRoute(route));
        const direction =
          nextIndex === currentIndex
            ? 'back'
            : nextIndex > currentIndex
            ? 'tab-forward'
            : 'tab-back';
        runLayerTransition(() => {
          if (route !== 'home') {
            window.clearTimeout(listenTimer);
            appState.avatarListening = false;
          }
          appState.route = route;
          appState.stack = [];
          appState.viewData = {};
        }, direction);
      }

      function goBack() {
        runLayerTransition(() => {
          const previous = appState.stack.pop();
          appState.route = previous || 'home';
          appState.viewData = {};
        }, 'back');
      }

      function openSecondary(route, viewData = {}) {
        runLayerTransition(() => {
          appState.stack.push(appState.route);
          appState.route = route;
          appState.viewData = viewData;
        }, 'forward');
      }

        if (route === 'models') {
          appState.agent.draftMode = appState.agent.activeMode;

        if (appState.route === 'capabilities') {

        runLayerTransition(() => {
          window.clearTimeout(listenTimer);
          appState.avatarListening = false;
          appState.stack = ['capabilities'];
          appState.route = route;
          appState.viewData = {};
        }, 'forward');

      function saveModel(form) {
        if (!form) return;
        const values = Object.fromEntries(new FormData(form).entries());
        const errors = {};
        for (const name of [
          'name',
          'provider',
          'endpoint',
          'modelId',
          'apiKey',
        ]) {
          if (!String(values[name] || '').trim()) errors[name] = '此项不能为空';
        }
        if (values.endpoint && !String(values.endpoint).includes('.')) {
          errors.endpoint = '请输入有效的演示服务地址';
        }
        if (Object.keys(errors).length) {
          appState.viewData = {
            ...appState.viewData,
            draft: values,
            errors,
          };
          renderApp();
          document
            .querySelector('.field-error')
            ?.previousElementSibling?.focus();
          return;
        }
        const mode = form.dataset.mode;
        const store = getModelList(form.dataset.list || 'unified');
        if (mode === 'edit') {
          const index = store.items.findIndex(
            model => model.id === form.dataset.id,
          );
          if (index >= 0)
            store.items[index] = {id: form.dataset.id, ...values};
        } else {
          const id = `model-${Date.now()}`;
          store.items.push({id, ...values});
          if (!store.activeId) store.activeId = id;
        }
        showToast('模型配置已保存', 'success');
        if (form.dataset.list === 'companion') {
          appState.route = 'companion-config';
          appState.stack = ['settings'];
        } else {
          appState.route = 'models';
          appState.stack = ['capabilities'];
        }
        appState.viewData = {};

      function saveErrand(form) {
        if (!form) return;
        const item = appState.memories.find(mem => mem.id === form.dataset.id);
        if (!item) return;
        const values = Object.fromEntries(new FormData(form).entries());
        const errandType =
          appState.viewData.draft?.errandType || item.errandType || 'once';
        const title = String(values.title || '').trim();
        const when = String(values.when || appState.viewData.draft?.when || '').trim();
        const errors = {};
        if (!title) errors.title = '请写下要办的事';
        if (errandType === 'schedule' && !when) errors.when = '定时需要写下时间';
        if (Object.keys(errors).length) {
          appState.viewData = {
            ...appState.viewData,
            draft: {title, when, errandType},
            errors,
          };
          renderApp();
          return;
        }
        item.title = title;
        item.errandType = errandType;
        item.when = errandType === 'schedule' ? when : '';
        appState.viewData = {};
        showToast('交代已更新', 'success');
        goBack();
      }

      function renderTaskConsole() {
        const task = appState.task;
        if (!task) return renderHome();
        const stateMeta = {
          running: ['NoNo 正在执行', '正在安全地完成当前步骤'],
          needs_confirmation: ['需要你的确认', '关键操作不会在未经允许时继续'],
          manual_takeover: ['请接管一下', '完成这个手动步骤后交还给 NoNo'],
          succeeded: ['任务已完成', 'NoNo 已生成本次执行摘要'],
          failed: ['任务未完成', '可以检查模型配置后再次尝试'],
          cancelled: ['任务已终止', 'NoNo 已停止执行后续步骤'],
        }[task.status] || ['NoNo 正在准备', '即将开始执行'];
        const terminal = ['succeeded', 'failed', 'cancelled'].includes(
          task.status,
        );
        const progress = terminal
          ? task.status === 'succeeded'
            ? 100
            : Math.round(((task.stepIndex + 1) / task.steps.length) * 100)
          : Math.round(((task.stepIndex + 0.5) / task.steps.length) * 100);
        return `
          <main class="app-screen task-console" data-route="home">
            <div class="status-bar"><span>9:41</span><button class="status-preview" type="button" data-action="toggle-notification-tray">通知预览</button></div>
            <header class="page-header">
              <div><p class="page-kicker">LIVE TASK</p><h1 class="page-title">任务执行</h1></div>
            </header>
            <section class="task-main-card">
              <div class="task-state-row">
                <div class="task-state-copy"><small>${task.status.replaceAll(
                  '_',
                  ' ',
                )}</small><h2>${stateMeta[0]}</h2><p>${stateMeta[1]}</p></div>
              </div>
              <div class="progress-track" aria-label="任务进度"><div class="progress-fill" style="width:${progress}%"></div></div>
              <div class="progress-meta"><span>步骤 ${Math.min(
                task.stepIndex + 1,
                task.steps.length,
              )} / ${task.steps.length}</span><span>${progress}%</span></div>
              ${
                task.status === 'needs_confirmation'
                  ? '<div class="state-callout is-attention"><strong>即将执行关键操作</strong><span>示例：提交订单、发送信息或修改系统设置前，需要你明确确认。</span></div>'
                  : ''
              }
              ${
                task.status === 'manual_takeover'
                  ? '<div class="state-callout is-attention"><strong>需要手动完成验证</strong><span>请在目标应用完成验证码或登录，完成后点击“交还给 NoNo”。</span></div>'
                  : ''
              }
              ${
                task.error
                  ? `<div class="state-callout is-attention"><strong>发生问题</strong><span>${escapeHtml(
                      task.error,
                    )}</span></div>`
                  : ''
              }
            </section>
            <section class="demo-controls" aria-label="原型演示控制">
              ${
                task.status === 'running'
                  ? '<button class="pill-button" type="button" data-action="advance-task">推进一步</button><button class="pill-button" type="button" data-action="simulate-takeover">模拟接管</button><button class="pill-button" type="button" data-action="simulate-error">模拟失败</button>'
                  : ''
              }
              ${
                task.status === 'needs_confirmation'
                  ? '<button class="primary-button" type="button" data-action="confirm-task">确认执行</button><button class="soft-button" type="button" data-action="reject-task">拒绝</button>'
                  : ''
              }
              ${
                task.status === 'manual_takeover'
                  ? '<button class="primary-button" type="button" data-action="complete-takeover">交还给 NoNo</button>'
                  : ''
              }
              ${
                !terminal
                  ? '<button class="danger-button" type="button" data-action="request-stop-task">终止</button>'
                  : '<button class="primary-button" type="button" data-action="new-task">新任务</button><button class="soft-button" type="button" data-action="rerun-current">再次执行</button>'
              }
            </section>
            <div class="section-heading"><h3>执行时间线</h3><span>${escapeHtml(
              task.instruction,
            )}</span></div>
            <section class="timeline-list">
              ${task.steps
                .map((step, index) => {
                  const complete =
                    task.status === 'succeeded' || index < task.stepIndex;
                  const current = !terminal && index === task.stepIndex;
                  return `<article class="timeline-item ${
                    complete ? 'is-complete' : current ? 'is-current' : ''
                  }"><span class="timeline-index">${
                    complete ? '✓' : index + 1
                  }</span><span class="timeline-copy"><strong>${step}</strong><span>${
                    complete ? '已完成' : current ? '正在处理' : '等待中'
                  }</span></span><span class="timeline-state">${
                    complete ? 'DONE' : current ? 'NOW' : 'NEXT'
                  }</span></article>`;
                })
                .join('')}
            </section>
          </main>`;
      }
